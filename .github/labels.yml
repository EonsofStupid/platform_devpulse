# GitHub labels for DevPulse
# Sync with: gh label create <name> --color <color> --description <desc>
# Or use EndBug/label-sync action

# Type
- name: bug
  color: "d73a4a"
  description: Something isn't working
- name: enhancement
  color: "a2eeef"
  description: New feature or request
- name: refactor
  color: "e6d821"
  description: Code improvement, no behavior change
- name: docs
  color: "0075ca"
  description: Documentation only

# Priority
- name: "p0: critical"
  color: "b60205"
  description: Blocks development
- name: "p1: high"
  color: "d93f0b"
  description: Should be done this sprint
- name: "p2: normal"
  color: "fbca04"
  description: Standard priority

# Area
- name: "area: desktop"
  color: "c5def5"
  description: SvelteKit/Tauri desktop app
- name: "area: engine"
  color: "bfd4f2"
  description: Rust signal engine
- name: "area: maestro"
  color: "d4c5f9"
  description: AI kernel
- name: "area: coldlight"
  color: "f9d0c4"
  description: Design system
- name: "area: ci"
  color: "e4e669"
  description: CI/CD and tooling

# Status
- name: triage
  color: "ededed"
  description: Needs categorization
- name: blocked
  color: "b60205"
  description: Waiting on external dependency
- name: "good first issue"
  color: "7057ff"
  description: Good for AI-assisted development
