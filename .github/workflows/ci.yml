name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `deps/llama-cpp-rs` and `deps/moshi` are git submodules vendored
          # under workspace.dependencies in Cargo.toml. Without recursive
          # submodule checkout, the build fails with
          # "failed to read deps/llama-cpp-rs/llama-cpp-2/Cargo.toml".
          submodules: recursive

      # Tauri 2.0 needs these on Ubuntu for webkit2gtk
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy

      # `.cargo/config.toml` sets `rustc-wrapper = "sccache"` for the whole
      # workspace so every local + CI invocation goes through the same
      # caching path. Without the binary on the runner, every cargo step
      # fails with `could not execute process 'sccache ...'`. Install
      # before any cargo step runs.
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Check engine feature (IP protection gate)
        run: cargo check -p devpulse-engine --no-default-features --features engine

      - name: Verify IP boundary (workspace deps)
        run: cargo xtask verify-ip-boundary

      - name: Test
        run: cargo test --workspace

      - name: Security audit
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

      - name: Dependency bans (IP boundary)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans

  desktop:
    name: Desktop Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interfaces/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Reads version from packageManager field in root package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "interfaces/desktop/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SvelteKit's generated tsconfig (`.svelte-kit/tsconfig.json`) is
      # referenced by the repo's `tsconfig.json` via the `extends` field
      # and is required for any TypeScript tooling that parses configs —
      # including vitest's TSConfck loader (`pnpm test:arch`),
      # svelte-check, and the production build. The file is created by
      # `svelte-kit sync`; without an explicit run the architecture
      # test (and any subsequent step that touches tsconfig.json) fails
      # with `TSConfckParseError: failed to resolve "extends":"./.svelte-kit/tsconfig.json"`.
      # `pnpm build` runs sync as a prepare step, but CI invokes
      # `test:arch` and `check` BEFORE `build`, so sync has to happen
      # explicitly before any step that reads tsconfig.json. Cheap
      # (~1s) and idempotent.
      - name: Generate .svelte-kit (sync)
        run: pnpm exec svelte-kit sync

      - name: Biome lint
        run: pnpm lint

      - name: Architecture tests (IP boundary)
        run: pnpm test:arch

      - name: Svelte check
        run: pnpm check

      - name: Build
        run: pnpm build

  # Gate job — configure branch protection to require this single check
  ci-pass:
    name: CI Pass
    needs: [rust, desktop]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.rust.result }}" != "success" || "${{ needs.desktop.result }}" != "success" ]]; then
            echo "CI failed: rust=${{ needs.rust.result }}, desktop=${{ needs.desktop.result }}"
            exit 1
          fi
