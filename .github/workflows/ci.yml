name: CI

on:
  pull_request:
    branches: [main]
    # Docs/agent-config changes do not affect the cargo or pnpm build
    # output, so they must not trigger the full llama-cpp/DuckDB/Tauri/Candle
    # workspace build. A PR is skipped only when EVERY changed file matches —
    # mixed PRs (docs + code) still run. NOTE: if branch protection later marks
    # "CI Pass" as a required check, switch to a dorny/paths-filter gate so the
    # required check still reports on skipped runs.
    # `scripts/docs/**` (not `scripts/**`) — `scripts/build/` contains
    # styledictionary + build tools that DO affect output.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "scripts/docs/**"
      - ".claude/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "scripts/docs/**"
      - ".claude/**"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # GHA runners default to Node 20 on actions/checkout@v4, actions/setup-node@v4,
  # pnpm/action-setup@v4. June 16, 2026 GHA forces Node 24; opting in now avoids
  # the deprecation warnings on every run and pins the runtime today.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # `debuginfo=0` cuts dev-profile rlib sizes by 4-6x. Without it, every
  # cargo step that links (Build + Test) ends in
  # `collect2: fatal error: ld terminated with signal 7 [Bus error]`
  # because ld mmaps every .rlib and runs out of address space against
  # the gigabyte-scale debuginfo from tauri + libduckdb-sys + surrealdb.
  # CI is verifying compile/link/test success; debug symbols
  # are irrelevant for the runner's ephemeral artifacts.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      # libduckdb-sys + surrealdb + Tauri's web stack together produce
      # several GB of intermediate object files; combined with the cargo
      # target dir + sccache cache + apt installs, the default Ubuntu
      # runner's ~14 GB free disk is not enough and the final `ar`
      # invocation that archives libduckdb fails with "No space left on
      # device". Free up ~30 GB by removing the Android SDK / dotnet /
      # GHC / CodeQL directories this workflow never uses.
      #
      # Do NOT `docker image prune` here: GitHub pre-builds container
      # actions (cargo-deny-action) at job setup, BEFORE this step — the
      # prune deleted that local image and the Security audit step died
      # with "pull access denied for <local image id>".
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      # No submodules — the vendored deps/ forks (moshi, llama-cpp-rs)
      # left with the kernel cut; clyffyos vendors its own.
      - uses: actions/checkout@v4

      # Tauri 2.0 needs these on Ubuntu for webkit2gtk.
      # libpipewire-0.3-dev required by libspa-sys (via rodio audio).
      # libasound2-dev required by alsa-sys (also via rodio audio).
      # Without either, the respective build script panics at
      # pkg-config exit 1 looking for the .pc descriptor.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            libasound2-dev \
            libgbm-dev \
            libdrm-dev \
            libudev-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy

      # `.cargo/config.toml` sets `rustc-wrapper = "sccache"` for the whole
      # workspace so every local + CI invocation goes through the same
      # caching path. Without the binary on the runner, every cargo step
      # fails with `could not execute process 'sccache ...'`. Install
      # before any cargo step runs.
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      # protoc + the RRO_DEPLOY_TOKEN insteadOf step were removed with the
      # kernel cut — rro/wal (embedded qortex) are Clyffy-side deps now; no
      # crate in this workspace fetches them.

      # `devpulse-telemetry` was extracted to its own private repo 2026-06-28;
      # workspace.dependencies declares it as `git = "..."`. The insteadOf
      # rewrite + CARGO_NET_GIT_FETCH_WITH_CLI is the only path cargo honors
      # for private git deps. Secret name `DEVPULSE_TELEMETRY_TOKEN` is set on
      # this repo via Infisical (`infisical run --env=dev -- gh secret set ...`).
      - name: Configure cargo for private devpulse-telemetry fetches
        env:
          DEVPULSE_TELEMETRY_TOKEN: ${{ secrets.DEVPULSE_TELEMETRY_TOKEN }}
        run: |
          if [ -z "$DEVPULSE_TELEMETRY_TOKEN" ]; then
            echo "::warning::DEVPULSE_TELEMETRY_TOKEN secret not set on this repo — cargo will fail to fetch private devpulse-telemetry dep."
            echo "Fix: pull PAT from Infisical and pipe to gh secret set."
            exit 0
          fi
          git config --global url."https://x-access-token:${DEVPULSE_TELEMETRY_TOKEN}@github.com/EonsofStupid/devpulse-telemetry".insteadOf "https://github.com/EonsofStupid/devpulse-telemetry"
          git config --global url."https://x-access-token:${DEVPULSE_TELEMETRY_TOKEN}@github.com/EonsofStupid/devpulse-telemetry.git".insteadOf "https://github.com/EonsofStupid/devpulse-telemetry.git"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          echo "Configured cargo to use DEVPULSE_TELEMETRY_TOKEN for private devpulse-telemetry fetches"

      # `clyffyos-wire` is the Tier-2 wire CONTRACT SSOT, owned by the private
      # EonsofStupid/clyffyos repo; `devpulse-gb10-client` declares it as a pinned
      # `git = "..."` dep so DevPulse builds standalone (no sibling checkout). Same
      # `insteadOf` pattern as telemetry above. Auth: prefers a dedicated
      # `CLYFFYOS_DEPLOY_TOKEN` secret when set; falls back to `RRO_DEPLOY_TOKEN`
      # (the owner's full-access PAT, already on this repo — operator-confirmed
      # 2026-07-09). Secrets are set via Infisical (`infisical run --env=dev --
      # gh secret set ...`), never pasted by hand. Neither set ⇒ warn + fail
      # downstream with cargo's auth error (never silently skip).
      - name: Configure cargo for private clyffyos-wire fetches
        env:
          CLYFFYOS_DEPLOY_TOKEN: ${{ secrets.CLYFFYOS_DEPLOY_TOKEN || secrets.RRO_DEPLOY_TOKEN }}
        run: |
          if [ -z "$CLYFFYOS_DEPLOY_TOKEN" ]; then
            echo "::warning::CLYFFYOS_DEPLOY_TOKEN secret not set on this repo — cargo will fail to fetch private clyffyos-wire dep."
            echo "Fix: pull PAT from Infisical and pipe to gh secret set."
            exit 0
          fi
          git config --global url."https://x-access-token:${CLYFFYOS_DEPLOY_TOKEN}@github.com/EonsofStupid/clyffyos".insteadOf "https://github.com/EonsofStupid/clyffyos"
          git config --global url."https://x-access-token:${CLYFFYOS_DEPLOY_TOKEN}@github.com/EonsofStupid/clyffyos.git".insteadOf "https://github.com/EonsofStupid/clyffyos.git"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          echo "Configured cargo to use CLYFFYOS_DEPLOY_TOKEN for private clyffyos-wire fetches"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Check engine feature (IP protection gate)
        run: cargo check -p devpulse-engine --no-default-features --features engine

      - name: Verify IP boundary (workspace deps)
        run: cargo xtask verify-ip-boundary

      - name: Test
        run: cargo test --workspace

      # cargo-deny runs on the HOST, not the containerized action: the
      # container inherits neither the job's git `insteadOf` auth (private
      # devpulse-telemetry / clyffyos-wire fetches fail) nor the host's
      # sccache that `.cargo/config.toml` demands as rustc-wrapper.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Security audit
        run: cargo deny check advisories

      - name: Dependency bans (IP boundary)
        run: cargo deny check bans

  desktop:
    name: Desktop Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interfaces/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Reads version from packageManager field in root package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "interfaces/desktop/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SvelteKit's generated tsconfig (`.svelte-kit/tsconfig.json`) is
      # referenced by the repo's `tsconfig.json` via the `extends` field
      # and is required for any TypeScript tooling that parses configs —
      # including vitest's TSConfck loader (`pnpm test:arch`),
      # svelte-check, and the production build. The file is created by
      # `svelte-kit sync`; without an explicit run the architecture
      # test (and any subsequent step that touches tsconfig.json) fails
      # with `TSConfckParseError: failed to resolve "extends":"./.svelte-kit/tsconfig.json"`.
      # `pnpm build` runs sync as a prepare step, but CI invokes
      # `test:arch` and `check` BEFORE `build`, so sync has to happen
      # explicitly before any step that reads tsconfig.json. Cheap
      # (~1s) and idempotent.
      - name: Generate .svelte-kit (sync)
        run: pnpm exec svelte-kit sync

      - name: Biome lint
        run: pnpm lint

      - name: Architecture tests (IP boundary)
        run: pnpm test:arch

      - name: Svelte check
        run: pnpm check

      - name: Build
        run: pnpm build

  # Gate job — configure branch protection to require this single check
  ci-pass:
    name: CI Pass
    needs: [rust, desktop]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.rust.result }}" != "success" || "${{ needs.desktop.result }}" != "success" ]]; then
            echo "CI failed: rust=${{ needs.rust.result }}, desktop=${{ needs.desktop.result }}"
            exit 1
          fi
