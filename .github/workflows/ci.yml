name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri 2.0 needs these on Ubuntu for webkit2gtk
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Check engine feature (IP protection gate)
        run: cargo check -p devpulse-engine --no-default-features --features engine

      - name: Verify IP boundary (workspace deps)
        run: cargo xtask verify-ip-boundary

      - name: Test
        run: cargo test --workspace

      - name: Security audit
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

      - name: Dependency bans (IP boundary)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans

  desktop:
    name: Desktop Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interfaces/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "interfaces/desktop/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome lint
        run: pnpm lint

      - name: Architecture tests (IP boundary)
        run: pnpm test:arch

      - name: Svelte check
        run: pnpm check

      - name: Build
        run: pnpm build

  # Gate job — configure branch protection to require this single check
  ci-pass:
    name: CI Pass
    needs: [rust, desktop]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.rust.result }}" != "success" || "${{ needs.desktop.result }}" != "success" ]]; then
            echo "CI failed: rust=${{ needs.rust.result }}, desktop=${{ needs.desktop.result }}"
            exit 1
          fi
