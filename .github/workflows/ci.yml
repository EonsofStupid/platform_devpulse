name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # GHA runners default to Node 20 on actions/checkout@v4, actions/setup-node@v4,
  # pnpm/action-setup@v6. June 16, 2026 GHA forces Node 24; opting in now avoids
  # the deprecation warnings on every run and pins the runtime today.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # `debuginfo=0` cuts dev-profile rlib sizes by 4-6x. Without it, every
  # cargo step that links (Build + Test) ends in
  # `collect2: fatal error: ld terminated with signal 7 [Bus error]`
  # because ld mmaps every .rlib and runs out of address space against
  # the gigabyte-scale debuginfo from tauri + candle + the burn
  # cascade. CI is verifying compile/link/test success; debug symbols
  # are irrelevant for the runner's ephemeral artifacts.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  restoration:
    name: Restoration provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # SOURCES.tsv retains original revisions across repository history.
          fetch-depth: 0

      - name: Recovery regression tests
        run: python3 -I scripts/recovery/test_restore_history.py

      - name: Verify every preserved or restored source
        run: python3 -I scripts/recovery/restore_history.py --check

  rust:
    name: Rust Checks
    # Keep pull requests light; compile on main or explicit dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # libduckdb-sys + candle + Tauri's web stack
      # together produce ~5-7 GB of intermediate object files; combined
      # with the cargo target dir + sccache cache + apt installs, the
      # default Ubuntu runner's ~14 GB free disk is not enough and the
      # final `ar` invocation that archives libduckdb fails with
      # "No space left on device". Free up ~30 GB by removing the
      # Android SDK / dotnet / GHC / CodeQL / dangling images that
      # this workflow never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          # Remove only dangling images; other runner tools may own tagged ones.
          sudo docker image prune -f || true
          df -h

      # No submodules: nothing in the build compiles deps/moshi (plan 0007,
      # decision 5), so a plain checkout proves a clean clone builds.
      - uses: actions/checkout@v4

      # Tauri 2.0 needs these on Ubuntu for webkit2gtk.
      # libpipewire-0.3-dev required by libspa-sys (via rodio audio).
      # libasound2-dev required by alsa-sys (also via rodio audio).
      # Without either, the respective build script panics at
      # pkg-config exit 1 looking for the .pc descriptor.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            libasound2-dev \
            libgbm-dev \
            libdrm-dev \
            libudev-dev \
            patchelf

      - name: Read workspace Rust toolchain
        id: rust-toolchain
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("rust-toolchain.toml", "rb") as source:
              toolchain = tomllib.load(source)["toolchain"]
          print(f"channel={toolchain['channel']}")
          print(f"components={','.join(toolchain['components'])}")
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: ${{ steps.rust-toolchain.outputs.components }}

      # protoc is required by `tonic-build` pulled in by the rro v2
      # alpha (crates/storage-api/build.rs runs tonic_build::configure
      # against qdrant.proto). Without it the build script fails with
      # "Could not find `protoc`". Matches the protoc-install step in
      # rro's own build.yml.
      - name: Install protoc
        uses: arduino/setup-protoc@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # `.cargo/config.toml` sets `rustc-wrapper = "sccache"` for the whole
      # workspace so every local + CI invocation goes through the same
      # caching path. Without the binary on the runner, every cargo step
      # fails with `could not execute process 'sccache ...'`. Install
      # before any cargo step runs.
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      # `rro` is a private GitHub repo; cargo's anonymous git fetch
      # cannot clone it. The `RRO_DEPLOY_TOKEN` secret (PAT with `repo`
      # scope on EonsofStupid/rro) is rewritten into the clone URL via
      # `git config --global url.<auth>.insteadOf`. Then we flip
      # `CARGO_NET_GIT_FETCH_WITH_CLI=true` so cargo shells out to `git`
      # (the only path that honors `insteadOf` rewrites — the libgit2
      # path does not). When the secret is unset, the step prints a
      # warning and the rust job will fail downstream with the existing
      # "failed to authenticate" error from cargo, which is the desired
      # signal — never silently skip private-dep auth.
      - name: Configure cargo for private rro fetches
        env:
          RRO_DEPLOY_TOKEN: ${{ secrets.RRO_DEPLOY_TOKEN }}
        run: |
          if [ -z "$RRO_DEPLOY_TOKEN" ]; then
            echo "::warning::RRO_DEPLOY_TOKEN secret not set on this repo — cargo will fail to fetch private rro dep."
            echo "Fix: gh secret set RRO_DEPLOY_TOKEN --repo EonsofStupid/platform_devpulse"
            exit 0
          fi
          git config --global url."https://x-access-token:${RRO_DEPLOY_TOKEN}@github.com/EonsofStupid/rro".insteadOf "https://github.com/EonsofStupid/rro"
          git config --global url."https://x-access-token:${RRO_DEPLOY_TOKEN}@github.com/EonsofStupid/rro.git".insteadOf "https://github.com/EonsofStupid/rro.git"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          echo "Configured cargo to use RRO_DEPLOY_TOKEN for private rro fetches"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Run on the configured host: cargo metadata needs its Rust toolchain,
      # sccache and private Git credentials. A separate Docker action lacks them.
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Rust workspace
        run: cargo check --workspace --locked

  desktop:
    name: Desktop Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interfaces/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # Reads version from packageManager field in root package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SvelteKit's generated tsconfig (`node_modules/$app/tsconfig.json`) is
      # what the repo's `tsconfig.json` extends (`"extends": "$app/tsconfig"`)
      # and is required for any TypeScript tooling that parses configs —
      # including vitest (`pnpm test:arch`), svelte-check, and the production
      # build. The file is created by `svelte-kit sync`. The desktop package's
      # `prepare` script runs it during `pnpm install`; this step keeps the
      # requirement explicit before any step that reads tsconfig.json. Cheap
      # (~1s) and idempotent.
      - name: Generate .svelte-kit (sync)
        run: pnpm exec svelte-kit sync

      - name: Svelte check
        run: pnpm check

      - name: Svelte check (ColdLight)
        run: pnpm --filter @devpulse/coldlight check

  # Gate job — configure branch protection to require this single check
  ci-pass:
    name: CI Pass
    needs: [rust, desktop, restoration]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ ( "${{ needs.rust.result }}" != "success" && "${{ needs.rust.result }}" != "skipped" ) || "${{ needs.desktop.result }}" != "success" || "${{ needs.restoration.result }}" != "success" ]]; then
            echo "CI failed: rust=${{ needs.rust.result }}, desktop=${{ needs.desktop.result }}, restoration=${{ needs.restoration.result }}"
            exit 1
          fi
