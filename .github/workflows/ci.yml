name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `deps/llama-cpp-rs` and `deps/moshi` are git submodules vendored
          # under workspace.dependencies in Cargo.toml. Without recursive
          # submodule checkout, the build fails with
          # "failed to read deps/llama-cpp-rs/llama-cpp-2/Cargo.toml".
          submodules: recursive

      # Tauri 2.0 needs these on Ubuntu for webkit2gtk.
      # libpipewire-0.3-dev required by libspa-sys (via rodio audio).
      # libasound2-dev required by alsa-sys (also via rodio audio).
      # Without either, the respective build script panics at
      # pkg-config exit 1 looking for the .pc descriptor.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            libasound2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy

      # protoc is required by `tonic-build` pulled in by the rro v2
      # alpha (crates/storage-api/build.rs runs tonic_build::configure
      # against qdrant.proto). Without it the build script fails with
      # "Could not find `protoc`". Matches the protoc-install step in
      # rro's own build.yml.
      - name: Install protoc
        uses: arduino/setup-protoc@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # `.cargo/config.toml` sets `rustc-wrapper = "sccache"` for the whole
      # workspace so every local + CI invocation goes through the same
      # caching path. Without the binary on the runner, every cargo step
      # fails with `could not execute process 'sccache ...'`. Install
      # before any cargo step runs.
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      # `rro` is a private GitHub repo; cargo's anonymous git fetch
      # cannot clone it. The `RRO_DEPLOY_TOKEN` secret (PAT with `repo`
      # scope on EonsofStupid/rro) is rewritten into the clone URL via
      # `git config --global url.<auth>.insteadOf`. Then we flip
      # `CARGO_NET_GIT_FETCH_WITH_CLI=true` so cargo shells out to `git`
      # (the only path that honors `insteadOf` rewrites — the libgit2
      # path does not). When the secret is unset, the step prints a
      # warning and the rust job will fail downstream with the existing
      # "failed to authenticate" error from cargo, which is the desired
      # signal — never silently skip private-dep auth.
      - name: Configure cargo for private rro fetches
        env:
          RRO_DEPLOY_TOKEN: ${{ secrets.RRO_DEPLOY_TOKEN }}
        run: |
          if [ -z "$RRO_DEPLOY_TOKEN" ]; then
            echo "::warning::RRO_DEPLOY_TOKEN secret not set on this repo — cargo will fail to fetch private rro dep."
            echo "Fix: gh secret set RRO_DEPLOY_TOKEN --repo EonsofStupid/platform_devpulse"
            exit 0
          fi
          git config --global url."https://x-access-token:${RRO_DEPLOY_TOKEN}@github.com/EonsofStupid/rro".insteadOf "https://github.com/EonsofStupid/rro"
          git config --global url."https://x-access-token:${RRO_DEPLOY_TOKEN}@github.com/EonsofStupid/rro.git".insteadOf "https://github.com/EonsofStupid/rro.git"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          echo "Configured cargo to use RRO_DEPLOY_TOKEN for private rro fetches"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Check engine feature (IP protection gate)
        run: cargo check -p devpulse-engine --no-default-features --features engine

      - name: Verify IP boundary (workspace deps)
        run: cargo xtask verify-ip-boundary

      - name: Test
        run: cargo test --workspace

      - name: Security audit
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

      - name: Dependency bans (IP boundary)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans

  desktop:
    name: Desktop Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interfaces/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Reads version from packageManager field in root package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "interfaces/desktop/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SvelteKit's generated tsconfig (`.svelte-kit/tsconfig.json`) is
      # referenced by the repo's `tsconfig.json` via the `extends` field
      # and is required for any TypeScript tooling that parses configs —
      # including vitest's TSConfck loader (`pnpm test:arch`),
      # svelte-check, and the production build. The file is created by
      # `svelte-kit sync`; without an explicit run the architecture
      # test (and any subsequent step that touches tsconfig.json) fails
      # with `TSConfckParseError: failed to resolve "extends":"./.svelte-kit/tsconfig.json"`.
      # `pnpm build` runs sync as a prepare step, but CI invokes
      # `test:arch` and `check` BEFORE `build`, so sync has to happen
      # explicitly before any step that reads tsconfig.json. Cheap
      # (~1s) and idempotent.
      - name: Generate .svelte-kit (sync)
        run: pnpm exec svelte-kit sync

      - name: Biome lint
        run: pnpm lint

      - name: Architecture tests (IP boundary)
        run: pnpm test:arch

      - name: Svelte check
        run: pnpm check

      - name: Build
        run: pnpm build

  # Gate job — configure branch protection to require this single check
  ci-pass:
    name: CI Pass
    needs: [rust, desktop]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.rust.result }}" != "success" || "${{ needs.desktop.result }}" != "success" ]]; then
            echo "CI failed: rust=${{ needs.rust.result }}, desktop=${{ needs.desktop.result }}"
            exit 1
          fi
