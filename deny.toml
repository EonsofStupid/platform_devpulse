# deny.toml
# cargo-deny configuration for DevPulse
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# Crates with licenses not in the allow list are denied by default in v2

[bans]
multiple-versions = "warn"
wildcards = "allow"
# Deny known bad crates
deny = [
    # Example: { name = "openssl" }
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/EonsofStupid/wal",
    "https://github.com/EonsofStupid/rro",
    "https://github.com/EonsofStupid/tar-rs",
    "https://github.com/EonsofStupid/Kokoros",
]
