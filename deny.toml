# deny.toml
# cargo-deny configuration for DevPulse
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Ignore unmaintained transitive dependencies - can't fix upstream
ignore = [
    # Tauri/GTK deps
    "RUSTSEC-2024-0370", # proc-macro-error
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    "RUSTSEC-2024-0420", # gtk-sys
    "RUSTSEC-2025-0057", # fxhash
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
    # libsql/surrealdb deps
    "RUSTSEC-2025-0134", # rustls-pemfile (libsql → hyper-rustls)
    "RUSTSEC-2025-0141", # bincode (libsql/surrealdb)
    # Transitive deps — upstream must fix
    "RUSTSEC-2021-0127", # serde_cbor (unmaintained, transitive)
    "RUSTSEC-2023-0071", # marvin attack (rsa, transitive via surrealdb)
    "RUSTSEC-2024-0436", # paste (unmaintained, transitive)
    "RUSTSEC-2024-0437", # number_prefix (unmaintained, transitive)
    "RUSTSEC-2025-0119", # protobuf recursion (transitive via ort/surrealdb)
    "RUSTSEC-2026-0044", # aws-lc x509 bypass (transitive via surrealdb)
    "RUSTSEC-2026-0048", # aws-lc CRL scope (transitive via surrealdb)
    "RUSTSEC-2026-0049", # aws-lc CRL matching (transitive via surrealdb)
    "RUSTSEC-2026-0098", # rustls-webpki URI name constraints (transitive via libsql/rustls 0.22)
    "RUSTSEC-2026-0099", # rustls-webpki wildcard DNS constraints (transitive via libsql/rustls 0.22)
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# Crates with licenses not in the allow list are denied by default in v2

[bans]
multiple-versions = "warn"
wildcards = "allow"
# Deny known bad crates
deny = [
    # Desktop must NEVER depend on clyffy directly.
    # All kernel access goes through the engine facade.
    { name = "devpulse-clyffy", wrappers = ["devpulse-engine"] },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/EonsofStupid/wal",
    "https://github.com/EonsofStupid/rro",
    "https://github.com/EonsofStupid/tar-rs",
    "https://github.com/EonsofStupid/Kokoros",
]
