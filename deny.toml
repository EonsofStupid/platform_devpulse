# deny.toml
# cargo-deny configuration for DevPulse
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Reviewed exceptions for advisories still present in the resolved graph
ignore = [
    # Tauri and build-time dependencies
    "RUSTSEC-2024-0370", # proc-macro-error
    "RUSTSEC-2025-0057", # fxhash
    "RUSTSEC-2025-0141", # bincode (Burn's record format)
    # Transitive deps — upstream must fix
    "RUSTSEC-2024-0436", # paste (unmaintained, transitive)
    "RUSTSEC-2025-0119", # protobuf recursion (transitive via ort/surrealdb)
    "RUSTSEC-2020-0163", # term_size unmaintained, via tokei 15 (latest release; repo scan)
    # zbus's own crates marked unmaintained with no successor release
    # (2026-10-17). Pulled in via zbus 5.14 by rfd (ashpd), tauri-plugin-
    # single-instance and xcap — the Linux D-Bus backends of those crates.
    "RUSTSEC-2026-0370", # zvariant unmaintained
    "RUSTSEC-2026-0371", # zbus_names unmaintained
    "RUSTSEC-2026-0372", # zvariant_derive unmaintained
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# Crates with licenses not in the allow list are denied by default in v2

[bans]
multiple-versions = "warn"
wildcards = "allow"
# Deny known bad crates
deny = [
    # Desktop accesses the included kernel through the engine facade.
    # AgentHub and persona MCP are the other existing runtime owners.
    { name = "devpulse-clyffy", wrappers = ["devpulse-engine", "devpulse-agenthub", "devpulse-persona-mcp"] },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/EonsofStupid/wal",
    "https://github.com/EonsofStupid/rro",
    "https://github.com/EonsofStupid/tar-rs",
    "https://github.com/EonsofStupid/Kokoros",
    "https://github.com/k2-fsa/sherpa-onnx",
]
