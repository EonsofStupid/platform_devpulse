# deny.toml
# cargo-deny configuration for DevPulse
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Ignore unmaintained transitive dependencies - can't fix upstream
ignore = [
    # Tauri/GTK deps
    "RUSTSEC-2024-0370", # proc-macro-error
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    "RUSTSEC-2024-0420", # gtk-sys
    "RUSTSEC-2025-0057", # fxhash
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
    # surrealdb + transitive deps — upstream must fix
    "RUSTSEC-2025-0134", # rustls-pemfile (transitive via hyper-rustls)
    "RUSTSEC-2021-0127", # serde_cbor (unmaintained, transitive)
    "RUSTSEC-2023-0071", # marvin attack (rsa, transitive via surrealdb)
    "RUSTSEC-2024-0436", # paste (unmaintained, transitive)
    "RUSTSEC-2024-0437", # number_prefix (unmaintained, transitive)
    "RUSTSEC-2025-0119", # protobuf recursion (transitive via surrealdb)
    "RUSTSEC-2026-0104", # aws-lc CRL parse panic (transitive via surrealdb — supersedes 0044/0048)
    "RUSTSEC-2026-0105", # core2 unmaintained + yanked (transitive via jieba-rs)
    # (The kernel cut removed the libsql/rro/ort trees — their ignores
    # left with them: bincode, aws-lc CRL matching, rustls-webpki ×2,
    # proc-macro-error2.)
    # quick-xml XML-parser DoS — 0.39.2 patched to 0.39.4; the remaining exposed
    # version is the pinned transitive 0.30.0 (platform dep), no semver-compatible
    # patch. Parsers see trusted internal data (surrealdb protocol), not
    # adversarial XML. Remove when the upstream pin bumps.
    "RUSTSEC-2026-0194", # quick-xml quadratic dup-attr scan (transitive 0.30.0)
    "RUSTSEC-2026-0195", # quick-xml unbounded namespace-declaration alloc DoS (transitive 0.30.0)
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# Crates with licenses not in the allow list are denied by default in v2

[bans]
multiple-versions = "warn"
wildcards = "allow"
# Deny known bad crates. The AI kernel is Clyffy's (clyffyos repo) —
# no crate in this workspace may link it, so no wrapper allowance
# exists; `cargo xtask verify-ip-boundary` enforces the inference-free
# build alongside this.
deny = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The AI-layer forks (wal/rro/tar-rs/Kokoros) left with the kernel cut;
# the two remaining private git deps are the telemetry primitives and
# the Tier-2 wire contract.
allow-git = [
    "https://github.com/EonsofStupid/devpulse-telemetry",
    "https://github.com/EonsofStupid/clyffyos",
]
