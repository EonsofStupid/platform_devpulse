# deny.toml
# cargo-deny configuration for DevPulse
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Ignore unmaintained transitive dependencies - can't fix upstream
ignore = [
    # Tauri/GTK deps
    "RUSTSEC-2024-0370", # proc-macro-error
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    "RUSTSEC-2024-0420", # gtk-sys
    "RUSTSEC-2025-0057", # fxhash
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
    # surrealdb deps
    "RUSTSEC-2025-0141", # bincode (surrealdb)
    # Transitive deps — upstream must fix
    "RUSTSEC-2021-0127", # serde_cbor (unmaintained, transitive)
    "RUSTSEC-2023-0071", # marvin attack (rsa, transitive via surrealdb)
    "RUSTSEC-2024-0436", # paste (unmaintained, transitive)
    "RUSTSEC-2024-0437", # number_prefix (unmaintained, transitive)
    "RUSTSEC-2025-0119", # protobuf recursion (transitive via ort/surrealdb)
    "RUSTSEC-2026-0049", # aws-lc CRL matching (transitive via surrealdb)
    "RUSTSEC-2026-0104", # aws-lc CRL parse panic (transitive via surrealdb — supersedes 0044/0048)
    "RUSTSEC-2026-0105", # core2 unmaintained + yanked (transitive via jieba-rs → rro)
    # No compatible fixed release; none parses untrusted input here (2026-10-15)
    "RUSTSEC-2026-0194", # quick-xml quadratic attr check: 0.30 (xcb build script, Linux),
                         # 0.38 (plist via tauri), 0.39 (wayland-scanner proc-macro); fix is 0.41
    "RUSTSEC-2026-0195", # quick-xml NsReader allocation: same three dependents as 0194
    "RUSTSEC-2020-0163", # term_size unmaintained, via tokei 15 (latest release; repo scan)
    "RUSTSEC-2026-0173", # proc-macro-error2 unmaintained, build-time proc-macro only
    # zip < 9 extraction flaws (2026-10-17). Our own zip (xtask) and duckdb's are
    # on 9; these two dependents have no release on zip >= 9:
    # - candle-core 0.10 (zip 7; 0.11 is on zip 8): reads .npy/.npz entries in
    #   memory, never calls `extract`;
    # - tauri-plugin-updater 2.x (zip 4, up to 2.14): `extract` runs only on an
    #   update bundle that passed minisign verification against our release key.
    "RUSTSEC-2026-0367", # SUID/SGID bits preserved on extract
    "RUSTSEC-2026-0368", # extract creates symlinks outside the destination
    "RUSTSEC-2026-0369", # extract applies permissions through symlinks
    # Distrusted emSign roots (2026-10-20). rustls-webpki, webpki-roots 1 and
    # webpki-root-certs are updated to the fixed releases (0.103.16, 1.0.10,
    # 1.0.10). webpki-roots 0.26.11 — via ureq 2 ← hf-hub 0.4 — is the
    # compatibility shim whose only dependency is webpki-roots 1.0.10, which it
    # re-exports: the fixed root list, flagged by version only. No 0.26 release
    # follows; plan 0001 Part L (L2: hf-hub 1, ureq 3) removes it.
    "RUSTSEC-2026-0381", # webpki-roots 0.26.11 shim over the fixed 1.0.10
    # zbus's own crates marked unmaintained with no successor release
    # (2026-10-17). Pulled in via zbus 5.14 by rfd (ashpd), tauri-plugin-
    # single-instance and xcap — the Linux D-Bus backends of those crates.
    "RUSTSEC-2026-0370", # zvariant unmaintained
    "RUSTSEC-2026-0371", # zbus_names unmaintained
    "RUSTSEC-2026-0372", # zvariant_derive unmaintained
    # crypto-bigint 0.5 timing variability (2026-10-24). Its only path is the
    # compiled-in Surreal crate: surrealdb 3.0.5 → surrealdb-core → jsonwebtoken
    # 10 → p256/p384 0.13 → elliptic-curve 0.13 → crypto-bigint 0.5. No fixed
    # release exists anywhere in that chain (surrealdb-core 3.3.4 still takes
    # jsonwebtoken 10; jsonwebtoken 11.1.0 still takes p256 0.13). Plan 0007
    # Part S removes the crate from the build (Surreal runs as its own
    # binary); S6 deletes this entry.
    "RUSTSEC-2026-0387", # crypto-bigint 0.5 via the embedded surrealdb crate
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# Crates with licenses not in the allow list are denied by default in v2

[bans]
multiple-versions = "warn"
wildcards = "allow"
# Deny known bad crates
deny = [
    # Desktop must NEVER depend on clyffy directly.
    # All kernel access goes through the engine facade.
    { name = "devpulse-clyffy", wrappers = ["devpulse-engine"] },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/EonsofStupid/wal",
    "https://github.com/EonsofStupid/rro",
    "https://github.com/EonsofStupid/tar-rs",
    "https://github.com/EonsofStupid/Kokoros",
]
