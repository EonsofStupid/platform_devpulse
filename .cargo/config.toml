[alias]
xtask = "run --package xtask --"

# All build env vars are defined in platform.default.toml [build.deps.*]
# xtask reads that TOML and sets env vars before invoking cargo.
# DO NOT add env vars here — they belong in the SSOT.
#
# Cargo-level settings (build wrapper, target rustflags, linker) DO live here.
# They're cargo config, not build-dep env vars, and the SSOT rule does not
# apply.

[build]
# sccache wraps every rustc invocation. Caches workspace dep compilation
# across `cargo clean`, branch switches, and toolchain bumps. With
# `incremental = true` (set in the workspace Cargo.toml dev profile),
# sccache silently bypasses incremental crates — net effect is "no
# regression on in-place edits, big win on cold builds." Verify with
# `sccache --show-stats` after a few builds.
#
# The unsuffixed `sccache` name is portable: Windows resolves it to
# `sccache.exe` via PATHEXT, Linux/macOS resolve it to the bare
# executable. The earlier `sccache.exe` form broke CI on the Ubuntu
# runner (CI: `cargo clippy` step in .github/workflows/ci.yml) because
# Linux has no implicit .exe resolution.
rustc-wrapper = "sccache"

# CRT alignment: DuckDB, ort, aws-lc-sys, and all other C/C++ deps use /MD (dynamic CRT).
# esaxx-rs (from tokenizers) uses the cc crate which defaults to /MT.
# This flag tells Rust to link with the dynamic CRT (/MD), making all cc-crate
# builds use /MD too. This is NOT a hack — it's the correct way to unify CRT
# linkage across all native deps in one binary.
#
# Fast linker: rust-lld from the `llvm-tools-preview` component that
# rust-toolchain.toml installs. The bare name is portable — rustc finds it in
# its own sysroot tools dir, no machine path. It MUST be declared here, not
# injected as an env var by xtask: cargo hashes the target linker into every
# unit's fingerprint (check-only units too), so a linker that only some cargo
# invocations see makes the others (the `cargo xtask` outer build, plain
# cargo, rust-analyzer) rebuild the shared units in place on every switch.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustflags = ["-C", "target-feature=-crt-static"]

[env]
PYO3_USE_ABI3_FORWARD_COMPATIBILITY = "1"
# Silence sccache's DEBUG-level log spam. Without this, every wrapped rustc
# invocation prints multiple "Couldn't open config file" / "Server sent
# CompileStarted" lines to stderr, drowning out actual compile progress.
# `warn` keeps real errors visible (cache write failures, server crashes)
# without the per-invocation noise.
SCCACHE_LOG = "warn"
# aws-lc-sys (TLS via rustls) assembles x86_64 code with NASM. When `nasm` is
# on PATH it is used; otherwise this allows the crate's own shipped prebuilt
# NASM objects (`aws-lc-sys/builder/prebuilt-nasm/`) instead of panicking.
# Keeps plain `cargo check -p <crate>` working on any machine without a
# machine-specific NASM path.
AWS_LC_SYS_PREBUILT_NASM = "1"
