[package]
name = "devpulse_desktop_backend"
version = "0.0.0"
description = "DevPulse Desktop"
authors = ["you"]
edition = "2021"
# Two `[[bin]]` entries — `devpulse-desktop-app` is the real Tauri
# application; `export-bindings` is a tooling-only helper invoked by
# `cargo xtask regen-bindings`. `default-run` tells Tauri (and bare
# `cargo run`) which one is "main" so `tauri build` can locate the
# packaged binary.
default-run = "devpulse-desktop-app"

[lib]
name = "devpulse_desktop_backend"
crate-type = ["lib"]

[[bin]]
name = "devpulse-desktop-app"
path = "src/main.rs"

# Bindings-export tool. Imports `build_specta_builder()` from the lib,
# calls `.export()` on it, exits. No Tauri runtime, no window, no
# filesystem state beyond writing `../src/lib/sys/generated/bindings.ts`.
# Replaces the prior `DEVPULSE_BINDINGS_EXPORT_ONLY=1 cargo run` hack.
# Invoked by `cargo xtask regen-bindings` and the bindings-drift hook.
[[bin]]
name = "export-bindings"
path = "bin/export-bindings.rs"

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
tauri = { version = "2.10.2", features = ["specta", "devtools"] }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }
# Persisted connection record ({data_dir}/user/clyffy_connection.toml) —
# matches the engine's direct `toml = "0.8"` (no workspace entry exists).
toml = "0.8"
uuid = { workspace = true, features = ["v4"] }
# kokoros disabled — espeak-rs-sys needs system install support (piper-rs fork sprint)
# NOTE: `rro` (qortex, the embedded Qdrant vector store) is intentionally
# NOT enabled here — it is Clyffy/ClyffyOS-side, behind the
# gb10-client wire. See the `kernel-inproc` feature below for why it cannot
# co-exist with the Turso store in a desktop build.
# There are no AI features (candle/inference/burn) — the engine is
# standalone Tier-1; AI is Clyffy's on GB10 via
# devpulse-gb10-client. No llama.cpp in the desktop compile graph.
devpulse-engine = { path = "../../../systems/devpulse-engine" }
# devpulse-media — audio_decode helpers for the voice loop (Whisper STT
# + Qwen3-TTS reference ingest). default-features = false to skip the
# camera-capture (nokhwa) feature, which is already declared directly
# below with a different backend; we only need audio decode here.
devpulse-media = { path = "../../../systems/devpulse-media", default-features = false }
devpulse-telemetry = { workspace = true }
# Clyffy wire client — standalone HTTP/JSON client to headless Clyffy
# (ClyffyOS) on the GB10. Held as separate Tauri managed state (NOT on
# Platform) so it keeps its own lean compile graph. The `specta`
# feature makes `ConnectionState` codegen TS bindings against one Rust source.
devpulse-gb10-client = { path = "../../../systems/devpulse-gb10-client", features = ["specta"] }
flume = "0.11"
arc-swap = { workspace = true }
rfd = "0.15"
sysinfo = "0.38.4"
keyring = "3"
rodio = "0.19"
# DevForge sidecar — REH web server lifecycle
portpicker = "0.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = { workspace = true }

# Vision / PixVix capture stack
# xcap: cross-platform screen + window capture (multi-monitor, PNG-friendly).
# nokhwa: cross-platform webcam capture (MediaFoundation on Windows, AVFoundation
#   on macOS, V4L2 on Linux). `input-native` is the canonical feature.
xcap = "0.9"
nokhwa = { version = "0.10", features = ["input-native"] }
# base64: encoding captured frames as data: URLs for one-shot ergonomics.
# 0.22 chosen to match the most-recent transitive in our lock file.
base64 = "0.22"
# image: already pulled transitively via xcap; declared explicitly for the
# PNG encoder we call directly.
image = "0.25"

[features]
default = ["inference"]
# Model loader + hardware push — always on for now.
# Separate feature so release builds can control binary size.
inference = []
# ── qortex / in-process vector store (RRO) — Tier-2 seam marker ──
# qortex (the embedded Qdrant fork) is Clyffy/ClyffyOS-side, NOT part of the
# standalone DevPulse desktop. It is deliberately un-buildable alongside the
# Tier-1 store: qortex hard-enables parking_lot `deadlock_detection`, which is
# mutually exclusive with the `send_guard` that Turso's sync SDK hard-enables —
# so a Turso-backed desktop CANNOT also link qortex (parking_lot fails to
# compile, by design). The in-process vector devtool surface
# (`commands/sys/vector`) is gated behind this feature and is served over the
# gb10-client wire (Tier-2, additive once Clyffy connects).
# EMPTY marker — no local `rro`;
# qortex is Clyffy/ClyffyOS-side behind the gb10-client wire. `commands/sys/vector`
# stays gated behind this never-enabled feature as the Tier-2 seam marker.
kernel-inproc = []
# Jesse's dev build — sidecar, Claude Code, full MCP surface.
# Compiled OUT of release binary. Passthrough to engine.
internal = ["devpulse-engine/internal"]
# There are no GPU proxy features (gpu-nvidia / gpu-vulkan / cpu-mkl) — GPU
# inference is Clyffy's on GB10; the desktop never
# selects a local GPU backend. (xtask's GPU-append step is a no-op.)

[lints]
workspace = true
