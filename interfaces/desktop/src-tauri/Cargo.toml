[package]
name = "devpulse_desktop_backend"
version = "0.0.0"
description = "DevPulse Desktop"
authors = ["you"]
edition = "2021"

[lib]
name = "devpulse_desktop_backend"
crate-type = ["lib"]

[[bin]]
name = "devpulse-desktop-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
tauri = { version = "2.10.2", features = ["specta", "devtools"] }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-global-shortcut = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
# kokoros disabled — espeak-rs-sys needs system install support (piper-rs fork sprint)
devpulse-engine = { path = "../../../systems/devpulse-engine", features = ["rro", "candle", "inference"] }
devpulse-telemetry = { workspace = true }
flume = "0.11"
arc-swap = { workspace = true }
rfd = "0.15"
sysinfo = "0.38.4"
keyring = "3"
rodio = "0.19"
# DevForge sidecar — REH web server lifecycle
portpicker = "0.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = { workspace = true }

# Vision / PixVix capture stack
# xcap: cross-platform screen + window capture (multi-monitor, PNG-friendly).
# nokhwa: cross-platform webcam capture (MediaFoundation on Windows, AVFoundation
#   on macOS, V4L2 on Linux). `input-native` is the canonical feature.
xcap = "0.9"
nokhwa = { version = "0.10", features = ["input-native"] }

[features]
default = ["inference"]
# Model loader + hardware push — always on for now.
# Separate feature so release builds can control binary size.
inference = []
# Jesse's dev build — sidecar, Claude Code, full MCP surface.
# Compiled OUT of release binary. Passthrough to engine.
internal = ["devpulse-engine/internal"]

[lints]
workspace = true
