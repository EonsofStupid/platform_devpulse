[package]
name = "devpulse_desktop_backend"
version = "0.0.0"
description = "DevPulse Desktop"
authors = ["you"]
edition = "2021"

[lib]
name = "devpulse_desktop_backend"
crate-type = ["lib"]

[[bin]]
name = "devpulse-desktop-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
tauri = { version = "2.10.2", features = [] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-single-instance = "2.4.0"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }
# kokoros disabled — espeak-rs-sys needs system install support (piper-rs fork sprint)
devpulse-engine = { path = "../../../systems/devpulse-engine", features = ["rro", "outlines"] }

[lints]
workspace = true
