<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!--
      Pre-module error capture. Minimal, non-invasive — matches the pattern
      used by Sentry / Bugsnag / Rollbar pre-SDK shims:
        - Bubble phase (default). Browser default error reporting runs first.
        - No console wrapper. Console methods stay native until the main SDK
          (`logger.ts::installGlobalHandlers`) intercepts them post-mount.
        - No try/catch swallowing. No `preventDefault`. Queue-only.
      Captured events land in `window.__DEVPULSE_EARLY_ERRORS__`.
      `logger.ts::drainEarlyErrors()` flushes them on first `markIpcReady`.
    -->
    <script>
      (() => {
        const q = [];
        window.__DEVPULSE_EARLY_ERRORS__ = q;
        window.addEventListener('error', (e) => {
          q.push({
            t: 'error',
            m: e.message,
            f: e.filename,
            l: e.lineno,
            c: e.colno,
            s: e.error?.stack,
          });
        });
        window.addEventListener('unhandledrejection', (e) => {
          q.push({
            t: 'rejection',
            s: e.reason?.stack ?? String(e.reason),
          });
        });
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
