[universal.unused_import_deletion]
id = "UNI-001"
name = "Unused Import Deletion"
severity = "high"
confidence = "observed"
source = "sme-jesse"description = """
AI removes imports that 'appear unused' but are needed for type-only imports, \
side effects, barrel re-exports, or upcoming code in multi-step tasks."""
affects = ["cursor", "bolt", "lovable", "claude-code", "windsurf", "replit", "v0", "aider", "copilot"]
mitigation = "Verify all import removals against type-only usage, side-effect imports, and multi-step task plans"
enforcer_action = "warn"
examples = [
  "Removes `import type { User }` because no runtime reference exists",
  "Strips CSS import with side effects (`import './styles.css'`)",
  "Deletes barrel re-export that downstream modules depend on",
]

[universal.premature_completion]
id = "UNI-002"
name = "Premature Completion / False 'Done'"
severity = "critical"
confidence = "confirmed"
source = "leak-2026-03-31"
description = """
AI reports task as complete when code does not compile, has type errors, or is \
only partially implemented. Claude Code's internal success metric for file writes \
is 'did bytes hit disk' — not 'does the code compile'. Internal benchmarks show \
29-30% false claims rate (Capybara v8, up from 16.7% in v4)."""
affects = ["claude-code", "cursor", "bolt", "lovable", "windsurf", "replit", "copilot"]
mitigation = "FORCE verification after every 'done': typecheck, lint, build. Never trust completion claims."
enforcer_action = "block_until_verified"
verified_stats = { false_claims_rate = "29-30%", source = "Claude Code v2.1.88 leaked source (Capybara v8)" }

