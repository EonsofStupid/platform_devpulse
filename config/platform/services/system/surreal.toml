# Surreal — upstream's server build, run as a supervised subprocess,
# plus three scoped namespaces (plan 0007 Part S; owner decision 6,
# 2026-10-24: a built binary, never compiled in; RRFlow replaces it).
#
# The build is installed inside the DevPulse folder by
# `cargo xtask fetch-surreal` (checked against upstream's published
# SHA-256). All three graph namespaces (system / user / global) live
# on that one server, isolated by namespace and database per query.
# Until the cutover (Part S, S5) the store is still opened in-process
# from `data_path`.
#
# Port comes from `[services.network.graph_api]`. If that port is
# taken by a foreign listener at boot, the allocator bumps +1 up to
# `max_bumps` times — the devtool Status tab shows the actual port
# vs. configured so you always know where it landed.

# ─────────────────────────────────────────────────────────────
# The server — build, store, lifecycle
# ─────────────────────────────────────────────────────────────
[services.system.surreal]
enabled = true
critical = true
auto_start = true
# The server build. A store migrates one way when a newer server opens
# it, so changing this is an update step: export first.
version = "3.0.5"
# Where builds are installed, relative to the data dir:
# `{install_dir}/{version}/surreal(.exe)`, with upstream's LICENSE.
install_dir = "global/runtimes/surreal"
# The store, relative to the data dir (SurrealKV today; RocksDB in S8).
data_path = "surreal/devpulse"
# Explicit binary instead of the installed build. Empty = the installed
# build above; nothing outside the DevPulse folder is searched.
binary_path = ""
# Root credentials passed to `surreal start`. The namespace-scoped
# users below (`system_user` / `system_password`) are created after
# the server is up so `.claude/hooks/*.js` can auth with them.
root_user = "root"
root_password = "root"
log_level = "warn"
# Optional port-bump ceiling. Omit to use the default (20).
# max_bumps = 20

# ─────────────────────────────────────────────────────────────
# Namespace scopes — one WS connection, three NS/DB pairs
# ─────────────────────────────────────────────────────────────
[services.system.graph]
enabled = true
critical = true
kind = "surreal"
# `path` is legacy — the one store is `[services.system.surreal]
# data_path`, shared across all scopes.
path = "system/surreal/reasoning"
namespace = "system"
database = "engine"
system_user = "devpulse_engine"
system_password = "dp_sys_2026!"
retry = { max_retries = 5, base_delay_ms = 750 }

[services.user.graph]
enabled = true
critical = true
kind = "surreal"
path = "user/surreal/profile"
namespace = "user"
database = "profile"
system_user = "devpulse_engine"
system_password = "dp_usr_2026!"
retry = { max_retries = 5, base_delay_ms = 750 }

[services.global.graph]
enabled = true
critical = true
kind = "surreal"
path = "global/surreal/knowledge"
namespace = "global"
database = "knowledge"
system_user = "devpulse_engine"
system_password = "dp_glb_2026!"
retry = { max_retries = 5, base_delay_ms = 750 }

[services.project.graph]
enabled = true
critical = false
kind = "surreal"
path_template = "projects/{project_id}/surreal/context"
namespace = "project"
