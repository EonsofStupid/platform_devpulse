[services.system.devforge]
# Default OFF (owner directive 2026-04-20 — no auto-load):
# DevForge spawns a Node REH server and blocks Platform::boot on
# `wait_for_health()` (up to 30s). Keeping boot deterministic and
# sub-10s means the code editor starts on demand, not at boot.
# Flip to `enabled = true` only when REH is bundled AND the owner
# explicitly wants it to come up with the platform.
enabled = false
critical = false
mode = "reh"
port = 0
user_data_dir = "devforge/user-data"
extensions_dir = "devforge/extensions"
workspace_path = "."
update_channel_url = "https://releases.devpulse.dev/devforge/channel.toml"