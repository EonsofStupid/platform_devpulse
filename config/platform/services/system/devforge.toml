[services.system.devforge]
# Default OFF (owner directive 2026-04-20 — no auto-load):
# DevForge spawns a Node REH server and blocks Platform::boot on
# `wait_for_health()` (up to 30s). Keeping boot deterministic and
# sub-10s means the code editor starts on demand, not at boot.
# Flip to `enabled = true` only when REH is bundled AND the owner
# explicitly wants it to come up with the platform.
enabled = false
critical = false
mode = "reh"
port = 0
user_data_dir = "devforge/user-data"
extensions_dir = "devforge/extensions"
workspace_path = "."
update_channel_url = "https://releases.devpulse.dev/devforge/channel.toml"

# REH bind host. Loopback only by default; setting non-loopback exposes
# the editor to the LAN — DevPulse does not gate this, the operator owns
# the security posture if they change it.
host = "127.0.0.1"

# Maximum seconds Platform::ensure_devforge_started will wait for the REH
# child to respond on its TCP port before declaring boot failed.
startup_timeout_secs = 30

# Milliseconds between successive TCP-connect probes during the startup
# health wait. Lower = faster ready signal, more wakeups.
health_poll_interval_ms = 250