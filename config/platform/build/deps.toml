[build.deps.nasm]
path = "deps/nasm/nasm.exe"
version = "3.01"
env = ["NASM", "AWS_LC_SYS_PREBUILT_NASM"]

[build.deps.python]
path = "deps/python/python.exe"
version = "3.14"
env = ["PYO3_PYTHON"]
extras = { PYO3_USE_ABI3_FORWARD_COMPATIBILITY = "1" }

[build.deps.cmake]
# System cmake on PATH (`C:\Program Files\CMake\bin\cmake.exe`). The dev box
# moved off VS 2019 Pro to VS 2022 Build Tools at `D:\localdev\BuildTools\`,
# which doesn't ship a bundled cmake; the system install is the canonical
# choice. `cmake-rs` (used by llama-cpp-sys-2) honours the `CMAKE` env var
# and skips PATH lookup when set, so we hand it the absolute path directly.
path = "C:/Program Files/CMake/bin/cmake.exe"
env = ["CMAKE"]
# CMAKE_GENERATOR pins the Visual Studio version cmake-rs picks. VS 2022
# (Build Tools 17.x, MSVC 14.44) is what's installed at
# `D:\localdev\BuildTools\`. The 2019 generator does NOT support
# `add_custom_command(... DEPFILE ...)` which ggml-vulkan's CMakeLists
# requires, so building with `gpu-vulkan` features against the 2019 gen
# fails at configure. 17 2022 supports DEPFILE and matches the MSVC
# toolchain that's actually present.
extras = { CMAKE_POLICY_VERSION_MINIMUM = "3.5", CMAKE_GENERATOR = "Visual Studio 17 2022" }

[build.deps.ninja]
# Path to the ninja bundled with VS 2019. NOT injected as
# `CMAKE_MAKE_PROGRAM` while the active generator is "Visual Studio 16
# 2019" — cmake-rs unconditionally forwards `CMAKE_MAKE_PROGRAM` via
# `-D`, and cmake then tries to use ninja AS MSBuild's build tool,
# which fails with "ninja: error: loading 'build.ninja'" because the
# VS generator emits `.vcxproj`, not `build.ninja`.
# When flipping `[build.deps.cmake].extras.CMAKE_GENERATOR` to "Ninja"
# (faster, single-config), set `env = ["CMAKE_MAKE_PROGRAM"]` here AND
# ensure cl.exe is on PATH (vcvars64.bat or explicit CC/CXX env).
path = "C:/Program Files (x86)/Microsoft Visual Studio/2019/Professional/Common7/IDE/CommonExtensions/Microsoft/CMake/Ninja/ninja.exe"
env = []
extras = {}

[build.deps.code_oss]
enabled = false