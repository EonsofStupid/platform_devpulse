[package]
name = "devpulse-process"
version = "0.1.0"
edition = "2021"
description = "Running programs on this machine: asking a command-line tool and reading its answer (no console window, a deadline, kill on drop, missing vs refused), and supervising long-lived runtimes that never outlive DevPulse. Shared by the kernel and the engine."

# Infra-layer tag — read by preflight check.infra-layer-deps.ts to enforce
# that crates under systems/infra/* may not depend on devpulse-engine,
# devpulse-media, devpulse-clyffy, or model-loader.
[package.metadata.devpulse]
layer = "infra"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
# Output readers run on spawned tasks; raw tokio::spawn is banned (clippy.toml).
devpulse-telemetry = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The kill-on-close Job Object (job.rs), the same version xtask uses.
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_Foundation",
    "Win32_Security",
    # JOBOBJECT_EXTENDED_LIMIT_INFORMATION is gated on it (IO_COUNTERS).
    "Win32_System_Threading",
    # Ctrl-Break to a child's process group (stop.rs).
    "Win32_System_Console",
] }

[target.'cfg(unix)'.dependencies]
# SIGTERM / SIGKILL to a child's process group (stop.rs).
libc = "0.2"
