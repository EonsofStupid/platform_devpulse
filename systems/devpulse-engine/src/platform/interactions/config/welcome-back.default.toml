# ═══════════════════════════════════════════════════════════════
# WELCOME-BACK — Clyffy Interaction Template
# ═══════════════════════════════════════════════════════════════
#
# Long-absence re-orient interaction. Fires when the user opens
# the app after a configurable absence window (default 7 days).
# Surfaces a short "here's what we were working on" summary +
# a suggested next action, then closes back to the chat surface.
#
# Distinct from the first-run Setup wizard — assumes models are
# already configured + libSQL has a meaningful session history.
# If neither is true, the dispatcher prefers Setup instead.
#
# Runtime flow:
#
#   1. App opens; dispatcher reads `last_seen_at` from preferences.
#   2. If gap > triggers.long_absence.days, opens this overlay
#      via the same SetupWizardOverlay dispatcher (interaction-id
#      keyed, not view-id keyed).
#   3. User reads the summary, picks "open chat" or "review
#      changes" or "skip", overlay closes.
#
# ── Schema ─────────────────────────────────────────────────────
#
# See `kernel/devpulse-clyffy/src/interactions/mod.rs` for the full
# `InteractionTemplate` type.
#
# Each phase maps to a Svelte sub-component the wizard renders.
# Component names follow the same pattern as the setup template
# (`{Phase}Phase.svelte`) so the dispatcher can dynamic-import.
#
# ═══════════════════════════════════════════════════════════════

id = "welcome-back"
description = "Long-absence re-orient — last-session summary + suggested next action"
entry_phase = "greet"

# ── Triggers ───────────────────────────────────────────────────

# Long-absence trigger — fires when the dispatcher sees a stored
# `last_seen_at` older than `days` days from the current run.
[[triggers]]
kind = "long_absence"
days = 7

# Manual trigger so a user can re-open the surface from a command
# palette / menu without waiting for the absence threshold.
[[triggers]]
kind = "manual"

# ── Phase machine ──────────────────────────────────────────────

# 1. Greet — Clyffy mascot wave + "welcome back, it's been N days"
#    header. Sets the emotional tone before the dense recap.

[[phases]]
id = "greet"
label = "Welcome back"
copy_block = "welcome_back_greet"
next = ["recap"]
terminal = false

# 2. Recap — last 3-5 sessions surfaced as a clickable list. Each
#    entry: title, last activity timestamp, suggested resume.
#    The component reads from the libSQL `chat_sessions` table.

[[phases]]
id = "recap"
label = "What you were working on"
copy_block = "welcome_back_recap"
next = ["nudge"]
terminal = false

# 3. Nudge — single Clyffy knowledge nudge pulled fresh from the
#    catalog (preferred type: `kdrop`). Gives the user one quick
#    tip about something that may have changed since they were
#    last active.

[[phases]]
id = "nudge"
label = "One quick tip"
copy_block = "welcome_back_nudge"
next = ["pick"]
terminal = false

# 4. Pick — three clear next actions: open chat, review changes,
#    skip. Pick fires a `welcome_back:next` event on the engine
#    bus carrying the chosen action so consumers (chat surface,
#    activity HUD) can light up appropriately.

[[phases]]
id = "pick"
label = "Where to next?"
copy_block = "welcome_back_pick"
next = ["close"]
terminal = false

# 5. Close — terminal. The dispatcher tears down the overlay and
#    records `last_seen_at = now` so the long-absence trigger
#    doesn't re-fire on the next app open.

[[phases]]
id = "close"
label = "Done"
copy_block = ""
next = []
terminal = true
