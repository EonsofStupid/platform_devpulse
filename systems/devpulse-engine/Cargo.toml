[package]
name = "devpulse-engine"
version = "0.1.0"
edition = "2021"

[features]
default = ["kernel"]
kernel = []
engine = []

[dependencies]
# Core
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }

# Kernel (the brain — always linked, facade controls exposure)
devpulse-maestro = { path = "../../kernel/devpulse-maestro" }

# Config
toml = "0.8"

[build-dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
