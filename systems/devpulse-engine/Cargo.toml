[package]
name = "devpulse-engine"
version = "1.0.1"
edition = "2021"

[features]
default = ["full", "mode-dev"]
# Build-surface pair (mutually exclusive; lib.rs compile_error-enforced):
# `full` = the trusted dev/operator build (dev-only providers, full MCP
# surface, ip/ dev tooling); `engine` = the restricted release surface
# (CI's IP gate builds `--no-default-features --features engine`).
full = []
engine = []
internal = []  # Jesse's dev build — sidecar, Claude Code, full MCP. Compiled OUT of release.

# Build-mode selection for the model-loader's `build_mode.rs`.
# Exactly one must be active; `mode-dev` is the default
# so local cargo workflows keep their dev behavior. Release/customer
# builds swap it via `--no-default-features` + the chosen mode.
mode-dev = []
mode-production = []
mode-customer = []
# Streaming ASR via sherpa-onnx (next-gen Kaldi). Off by default —
# enabling pulls ~100 MB of prebuilt native binaries at build time.
# `cargo xtask run-dev --features sherpa` to opt in.
sherpa = ["dep:sherpa-onnx"]

# NVIDIA GPU telemetry (VRAM / util / temp) via NVML. Off by default —
# enabling links nvml-wrapper, which loads the NVML shared library at
# runtime (graceful Err when no NVIDIA driver is present). Tier-1 LOCAL
# hardware monitoring — NOT inference (that's Clyffy's on GB10); pairs
# with the engine's `platform/hardware/metrics.rs`.
nvml = ["dep:nvml-wrapper"]

# There are no AI features here (rro / candle / inference / llguidance /
# burn + gpu-nvidia / gpu-vulkan / cpu-mkl) — all AI is Clyffy's on GB10,
# served over the gb10-client wire. DevPulse builds
# standalone, Tier-1 (Turso + DuckDB + Moka), no AI linkage, no llama.

[dependencies]
# Core
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
# `v5` (stable name→UUID) is used by the model-loader discovery
# scanner for stable registry ids; `v7`/`serde` come from the workspace pin.
uuid = { workspace = true, features = ["v5"] }
tokio = { workspace = true }
async-trait = "0.1"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }

# DevPulse-owned agnostic store — Turso (SSOT) + DuckDB (analytics) + Moka
# (cache). Kernel-free; supplies the Tier-1 persistence adapters that used to
# come from the kernel. See systems/devpulse-store.
devpulse-store = { path = "../devpulse-store" }

# The AI layer is Clyffy's, in the clyffyos repo — the engine links no
# AI/kernel crates. AI services are reached over the gb10-client wire;
# Tier-1 stores come from devpulse-store. The RRD daemon (clyffyos-rrd)
# is likewise Clyffy-side; the engine's RrdLifecycleTranslator owns the
# subscriber half of the `rrd.lifecycle` tracing contract with the
# target const defined locally (see services/rrd_translator.rs).

# HTTP server (SurrealDB endpoint on :8822, MCP SSE on :9315)
axum = "0.8"
base64 = "0.22"
async-stream = "0.3"
futures-core = "0.3"

# Config — layered defaults / overlay / env.
# Figment owns the new per-module config loader (platform/config/loader.rs).
# Bare `toml` stays until the legacy monolith (platform/config.rs) retires.
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"

# Process metrics (real RSS, CPU — no faking)
sysinfo = "0.33"

# Sync→async channel bridge (audio command queue)
flume = "0.11"

# Infra — telemetry primitives (Envelope<T>, spawn, channels, OTel SDK)
devpulse-telemetry = { workspace = true }

# MCP Server — official Rust SDK for Model Context Protocol
rmcp = { version = "1.5", features = ["server", "macros", "transport-io"] }
schemars = "0.8"

# DevForge (VS Code REH) — port allocation + token generation
portpicker = "0.1"
rand = "0.8"

# Ollama sidecar HTTP client + model-loader HF search / LFS-oid tree fetch.
# `blocking` is required by `models/download.rs::fetch_lfs_oid_map`; async
# `Client` (HF search) rides the same crate. rustls-tls avoids a system
# OpenSSL dep on Windows/Linux release builds.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

# ── Model-loader MANAGEMENT deps ────────────────────────────────────
# All pure management — zero inference linkage (verified by `cargo tree`).
# hf-hub: HuggingFace downloader/search. rustls (no OpenSSL), sync `ureq`
#   path used by models/download.rs (`api::sync` + `Progress`).
hf-hub = { version = "0.4", default-features = false, features = ["ureq", "rustls-tls"] }
# sha2: HF LFS oid (SHA-256) download-integrity verification.
sha2 = "0.10"
# ggus: pure-Rust GGUF header/metadata reader — candle-free GGUF parse
#   for discovery.rs (no `candle_core::quantized::gguf_file` linkage).
ggus = "0.5"
# parking_lot: `RwLock<HardwareMonitor>` + `Mutex<HashSet>` on ModelLoaderService.
parking_lot = "0.12"

# Sherpa streaming ASR (next-gen Kaldi / onnxruntime). Optional — the
# crate's build script downloads ~100 MB of prebuilt native binaries,
# so it is gated behind the `sherpa` cargo feature. v1.12.x matches the
# public sherpa-onnx C library version at time of integration.
sherpa-onnx = { version = "1.12", optional = true }

# NVIDIA GPU telemetry — optional, gated behind the `nvml` feature.
# Loads the NVML shared library at runtime; no NVIDIA driver ⇒ graceful
# Err and GPU metrics fall back to the platform fallback path. Local
# hardware monitoring only; inference GPUs live on Clyffy/GB10.
nvml-wrapper = { version = "0.10", optional = true }

# Lock-free Option<Arc<T>> for lazy-started services (DevForge)
arc-swap = { workspace = true }

# Audio playback (TTS output → speakers)
rodio = "0.19"

# No Burn dep — the Burn encoder adapter is Clyffy's;
# Burn/RRO run on Clyffy/GB10, reached over the wire.

[build-dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
