[package]
name = "devpulse-engine"
version = "0.1.0"
edition = "2021"

[features]
default = ["kernel"]
kernel = []
engine = []
rro = ["devpulse-maestro/rro"]
kokoros = ["devpulse-maestro/kokoros"]
outlines = ["devpulse-maestro/outlines"]

[dependencies]
# Core
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }

# Kernel (the brain — always linked, facade controls exposure)
devpulse-maestro = { path = "../../kernel/devpulse-maestro" }

# HTTP server (SurrealDB endpoint on :8822)
axum = "0.8"

# Config
toml = "0.8"

# Process metrics (real RSS, CPU — no faking)
sysinfo = "0.33"

[build-dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
