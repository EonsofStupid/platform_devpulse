[package]
name = "devpulse-engine"
version = "1.0.1"
edition = "2021"

[features]
default = ["kernel"]
kernel = []
engine = []
internal = []  # Jesse's dev build — sidecar, Claude Code, full MCP. Compiled OUT of release.
# Streaming ASR via sherpa-onnx (next-gen Kaldi). Off by default —
# enabling pulls ~100 MB of prebuilt native binaries at build time.
# `cargo xtask run-dev --features sherpa` to opt in.
sherpa = ["dep:sherpa-onnx"]

# Kernel AI features (rro / candle / inference / llguidance / burn +
# gpu-nvidia / gpu-vulkan / cpu-mkl) REMOVED — every one referenced
# `devpulse-clyffy/*` and pulled llama.cpp. All AI is Clyffy's on GB10,
# served over the gb10-client wire (kernel-severance). DevPulse builds
# standalone, Tier-1 (Turso + DuckDB + Moka), no kernel, no llama.

[dependencies]
# Core
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }

# DevPulse-owned agnostic store — Turso (SSOT) + DuckDB (analytics) + Moka
# (cache). Kernel-free; supplies the Tier-1 persistence adapters that used to
# come from the kernel. See systems/devpulse-store.
devpulse-store = { path = "../devpulse-store" }

# devpulse-clyffy dependency REMOVED (kernel-severance) — the engine no
# longer links the kernel or llama.cpp. AI services are Clyffy's on GB10,
# reached over the gb10-client wire; Tier-1 stores come from devpulse-store.

# Reason Ready Daemon (RRD) — in-process orchestrator for the RRO
# cluster's hot-update lifecycle. The engine consumes only the
# tracing taxonomy (`RRD_LIFECYCLE_TARGET`) for the
# `RrdLifecycleTranslator` layer; daemon construction lives in
# kernel-internal callers. tracing-subscriber (already a dep
# above) provides the Layer infrastructure the translator extends.
rrd = { path = "../../kernel/rrd" }

# HTTP server (SurrealDB endpoint on :8822, MCP SSE on :9315)
axum = "0.8"
base64 = "0.22"
async-stream = "0.3"
futures-core = "0.3"

# Config — layered defaults / overlay / env.
# Figment owns the new per-module config loader (platform/config/loader.rs).
# Bare `toml` stays until the legacy monolith (platform/config.rs) retires.
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"

# Process metrics (real RSS, CPU — no faking)
sysinfo = "0.33"

# Sync→async channel bridge (audio command queue)
flume = "0.11"

# Infra — telemetry primitives (Envelope<T>, spawn, channels, OTel SDK)
devpulse-telemetry = { workspace = true }

# MCP Server — official Rust SDK for Model Context Protocol
rmcp = { version = "1.5", features = ["server", "macros", "transport-io"] }
schemars = "0.8"

# DevForge (VS Code REH) — port allocation + token generation
portpicker = "0.1"
rand = "0.8"

# Ollama sidecar HTTP client — matches kernel/model-loader's reqwest config
# (rustls-tls avoids a system OpenSSL dep on Windows/Linux release builds).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Sherpa streaming ASR (next-gen Kaldi / onnxruntime). Optional — the
# crate's build script downloads ~100 MB of prebuilt native binaries,
# so it is gated behind the `sherpa` cargo feature. v1.12.x matches the
# public sherpa-onnx C library version at time of integration.
sherpa-onnx = { version = "1.12", optional = true }

# Lock-free Option<Arc<T>> for lazy-started services (DevForge)
arc-swap = { workspace = true }

# Audio playback (TTS output → speakers)
rodio = "0.19"

# Burn dep REMOVED (kernel-severance) — the boot-time Burn encoder adapter
# was deleted with the kernel Tier-2 boot stages; Burn/RRO run on Clyffy/GB10.

[build-dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
