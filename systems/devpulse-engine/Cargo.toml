[package]
name = "devpulse-engine"
version = "1.0.1"
edition = "2021"

[features]
default = ["kernel"]
kernel = []
engine = []
internal = []  # Jesse's dev build — sidecar, Claude Code, full MCP. Compiled OUT of release.
rro = ["devpulse-clyffy/rro"]
candle = ["devpulse-clyffy/candle"]
inference = ["devpulse-clyffy/model-loader"]
llguidance = ["devpulse-clyffy/llguidance"]
# Streaming ASR via sherpa-onnx (next-gen Kaldi). Off by default —
# enabling pulls ~100 MB of prebuilt native binaries at build time.
# `cargo xtask run-dev --features sherpa` to opt in.
sherpa = ["dep:sherpa-onnx"]
# Burn-backed RRO encoder. Activates clyffy's `burn-cpu` so the
# `ConnectomeBurnAdapter` is reachable from boot, plus implies `inference`
# for the kernel ModelLoaderService surface that consumes the adapter.
# `dep:burn` exposes the `burn::backend::flex` + `burn::tensor::dtype`
# surfaces that `platform/boot/model_loader.rs::build_burn_encoder_adapter`
# uses to construct the device + narrow safetensors f32 → bf16 at boot.
burn = ["devpulse-clyffy/burn-cpu", "dep:burn", "inference"]

# ── GPU proxy features (build-time vendor selection) ──
# Pick ONE per build. Selection is build-time because cargo features are
# build-time; the binary is committed to its GPU backend. xtask detects the
# host GPU vendor at invocation time and appends the right proxy.
#
# `gpu-nvidia`  — peak perf on NVIDIA. CUDA Toolkit 12.x required at build.
#                 Bundles cudart/cublas DLLs (~100 MB) for the release.
# `gpu-vulkan`  — cross-vendor (AMD + NVIDIA + Intel). Vulkan SDK required at
#                 build; runtime loads vulkan-1.dll from the driver. ~80-90%
#                 of CUDA perf on NVIDIA, AND the only GPU path on AMD on
#                 Windows (llama-cpp-2 0.1.145 has no `hipblas`/`rocm` feature
#                 yet, so AMD/Linux users also route through Vulkan via wgpu).
gpu-nvidia = [
    "devpulse-clyffy/burn-cuda",
    "devpulse-clyffy/model-loader-cuda",
    "devpulse-clyffy/model-loader-llama-cuda",
    "candle",
    "inference",
]
gpu-vulkan = [
    # NOTE: `devpulse-clyffy/burn-wgpu` is intentionally omitted. Burn 0.21 →
    # cubecl-wgpu 0.10 → wgpu 29.0.3 → wgpu-hal 29.0.3 activates the `dx12`
    # backend through wgpu's default features, dragging in gpu-allocator 0.28
    # (windows 0.54) which conflicts with wgpu-hal's own windows 0.62 direct
    # dep. Two `windows` crate versions = type mismatch in
    # wgpu-hal/src/dx12/suballocation.rs. We don't need DX12 (Vulkan is the
    # target), but cargo's feature unification can't subtract features, so
    # disabling DX12 requires forking cubecl-wgpu. Until upstream fixes the
    # gpu-allocator/windows version skew, Burn runs on its `flex` CPU backend
    # under gpu-vulkan; llama.cpp still gets Vulkan acceleration via
    # model-loader-llama-vulkan.
    "devpulse-clyffy/model-loader-llama-vulkan",
    "inference",
]
# CPU-MKL — Intel Math Kernel Library for accelerated BLAS/LAPACK on CPU.
# Stands alone (pure CPU build with MKL) OR composes with a GPU feature
# above (GPU for the heavy nets, MKL for the remaining CPU math).
cpu-mkl = [
    "devpulse-clyffy/model-loader-mkl",
    "candle",
    "inference",
]

[dependencies]
# Core
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }

# Kernel (the brain — always linked, facade controls exposure)
devpulse-clyffy = { path = "../../kernel/devpulse-clyffy", features = ["specta"] }

# Reason Ready Daemon (RRD) — in-process orchestrator for the RRO
# cluster's hot-update lifecycle. The engine consumes only the
# tracing taxonomy (`RRD_LIFECYCLE_TARGET`) for the
# `RrdLifecycleTranslator` layer; daemon construction lives in
# kernel-internal callers. tracing-subscriber (already a dep
# above) provides the Layer infrastructure the translator extends.
rrd = { path = "../../kernel/rrd" }

# HTTP server (SurrealDB endpoint on :8822, MCP SSE on :9315)
axum = "0.8"
base64 = "0.22"
async-stream = "0.3"
futures-core = "0.3"

# Config — layered defaults / overlay / env.
# Figment owns the new per-module config loader (platform/config/loader.rs).
# Bare `toml` stays until the legacy monolith (platform/config.rs) retires.
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"

# Process metrics (real RSS, CPU — no faking)
sysinfo = "0.33"

# Sync→async channel bridge (audio command queue)
flume = "0.11"

# Infra — telemetry primitives (Envelope<T>, spawn, channels, OTel SDK)
devpulse-telemetry = { workspace = true }

# MCP Server — official Rust SDK for Model Context Protocol
rmcp = { version = "1.5", features = ["server", "macros", "transport-io"] }
schemars = "0.8"

# DevForge (VS Code REH) — port allocation + token generation
portpicker = "0.1"
rand = "0.8"

# Ollama sidecar HTTP client — matches kernel/model-loader's reqwest config
# (rustls-tls avoids a system OpenSSL dep on Windows/Linux release builds).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Sherpa streaming ASR (next-gen Kaldi / onnxruntime). Optional — the
# crate's build script downloads ~100 MB of prebuilt native binaries,
# so it is gated behind the `sherpa` cargo feature. v1.12.x matches the
# public sherpa-onnx C library version at time of integration.
sherpa-onnx = { version = "1.12", optional = true }

# Lock-free Option<Arc<T>> for lazy-started services (DevForge)
arc-swap = { workspace = true }

# Audio playback (TTS output → speakers)
rodio = "0.19"

# Burn — optional, gated by the `burn` feature. Engine boot constructs
# the FlexDevice + sets default dtypes for the ConnectomeBurnAdapter that
# kernel slot dispatch calls into. Workspace pins the version + the
# minimal `std,flex` default-feature set.
burn = { workspace = true, optional = true }

[build-dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
