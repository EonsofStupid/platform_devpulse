[package]
name = "devpulse-engine"
version = "0.1.0"
edition = "2021"

[features]
default = ["kernel"]
kernel = []
engine = []
internal = []  # Jesse's dev build — sidecar, Claude Code, full MCP. Compiled OUT of release.
rro = ["devpulse-clyffy/rro"]
candle = ["devpulse-clyffy/candle"]
inference = ["devpulse-clyffy/model-loader"]
llguidance = ["devpulse-clyffy/llguidance"]

[dependencies]
# Core
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }

# Kernel (the brain — always linked, facade controls exposure)
devpulse-clyffy = { path = "../../kernel/devpulse-clyffy" }

# HTTP server (SurrealDB endpoint on :8822, MCP SSE on :9315)
axum = "0.8"
base64 = "0.22"
async-stream = "0.3"
futures-core = "0.3"

# Config
toml = "0.8"

# Process metrics (real RSS, CPU — no faking)
sysinfo = "0.33"

# Sync→async channel bridge (audio command queue)
flume = "0.11"

# Infra — telemetry primitives (Envelope<T>, spawn, channels, OTel SDK)
devpulse-telemetry = { workspace = true }

# MCP Server — official Rust SDK for Model Context Protocol
rmcp = { version = "1.5", features = ["server", "macros", "transport-io"] }
schemars = "0.8"

# DevForge REH service — port allocation + token generation
portpicker = "0.1"
rand = "0.8"

# Audio playback (TTS output → speakers)
rodio = "0.19"

[build-dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
