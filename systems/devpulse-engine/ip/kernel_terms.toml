# ═══════════════════════════════════════════════════════════════
# KERNEL TERMS DICTIONARY — UNIVERSAL SSOT
# ═══════════════════════════════════════════════════════════════
#
# Every internal term that must NEVER appear in the engine build.
# This file drives BOTH Rust compile-time filtering (ip_term! macro)
# AND frontend UI label generation (TOML→TS codegen).
#
# Fields:
#   kernel    = internal term (what we use in development)
#   engine    = public equivalent (what crosses IPC boundary to frontend)
#   prod      = user-friendly label (what customers see in production UI)
#   dev       = raw tech label (what devs see in dev mode UI)
#   category  = grouping for dev tool UI
#   context   = where this term appears (logs, traces, ui-text, errors, metrics)
#   severity  = "hard" (compile error if found) or "soft" (warning, may be contextual)
#
# Adding a new term:
#   1. Add entry here with ALL fields (kernel, engine, prod, dev)
#   2. Use ip_term!("TERM") in Rust code (not raw string)
#   3. cargo build regenerates vocabulary HashMap
#   4. pnpm generate:terminology regenerates frontend TS
#   5. CI scanner auto-catches raw string usage
#   NO other code changes needed.

