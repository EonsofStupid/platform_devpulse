# ═══════════════════════════════════════════════════════════════
# KERNEL TERMS DICTIONARY — SSOT
# ═══════════════════════════════════════════════════════════════
#
# Every internal term that must NEVER appear in the engine build.
#
# Fields:
#   kernel    = internal term (what we use in development)
#   engine    = public equivalent (what the customer sees)
#   category  = grouping for dev tool UI
#   context   = where this term appears (logs, traces, ui-text, errors, metrics)
#   severity  = "hard" (compile error if found) or "soft" (warning, may be contextual)
#
# Adding a new term:
#   1. Add entry here
#   2. Use ip_term!("TERM") in code (not raw string)
#   3. cargo build regenerates vocabulary HashMap
#   4. CI scanner auto-catches raw string usage
#   NO other code changes needed.

