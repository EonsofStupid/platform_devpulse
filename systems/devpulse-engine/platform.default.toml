# Platform service configuration — embedded at compile time via include_str!().
# Override at runtime by placing a platform.toml in your data directory.
#
# Every database, API, and dev tool the platform runs is a SERVICE.
# Boot pipeline initializes each service, captures output, verifies health.
# UI does not render until all critical services report ready.
#
# Layout:
#   .userdata/
#   ├── system/         Kernel/engine internal state (never user-facing)
#   │   ├── libsql/     platform.db — kernel state, boot records, internal KV
#   │   ├── duckdb/     analytics.duckdb — system telemetry, ROTI metrics
#   │   └── surreal/    reasoning/ — kernel FSM, state transitions, HMM
#   ├── user/           User-scoped data (auto-managed, never user-facing)
#   │   ├── libsql/     user.db — sessions, messages, tasks, user config
#   │   └── surreal/    profile/ — user knowledge graph, long-term memory
#   ├── projects/       Per-project namespaced data (isolated per project ID)
#   │   └── {id}/
#   │       └── surreal/ context/ — project-specific knowledge, key junctions
#   ├── global/         Cross-project shared data
#   │   └── surreal/    knowledge/ — shared knowledge graph, decisions
#   └── logs/           Rotated log files, boot.log

[portable]
# When true, all data stays within .userdata/ relative to the binary/project root.
# When false, uses OS-standard app data directories (AppData/Local on Windows).
enabled = true

# ══════════════════════════════════════════════════════════════════
# SERVICES — every component the platform boots is a service
# ══════════════════════════════════════════════════════════════════

# ── System services ──────────────────────────────────────────────
# Kernel internals. Never exposed to user. Owns boot state, telemetry, FSM.

[services.system.relational]
enabled = true
critical = true
kind = "libsql"
path = "system/libsql/platform.db"
retry = { max_retries = 5, base_delay_ms = 500 }

[services.system.analytics]
enabled = true
critical = true
kind = "duckdb"
path = "system/duckdb/analytics.duckdb"
# DuckDB uses exclusive file locks — generous retry for hot-reload
retry = { max_retries = 5, base_delay_ms = 500 }

[services.system.graph]
enabled = true
critical = true
kind = "surreal"
path = "system/surreal/reasoning"
namespace = "system"
database = "engine"
# Dedicated system account — platform engine authenticates as this user.
# Each scope (system, user, global) has its own account with OWNER role.
# External tools use root via the HTTP API on :8822.
system_user = "devpulse_engine"
system_password = "dp_sys_2026!"
# SurrealKV WAL flush on shutdown can take longer — extra generous
retry = { max_retries = 5, base_delay_ms = 750 }

[services.system.cache]
enabled = true
critical = true
kind = "moka"
max_capacity = 10_000
time_to_live_secs = 300
time_to_idle_secs = 60

[services.system.vector]
enabled = true
critical = true
kind = "rro"
path = "system/rro/storage"

# [services.system.voice] — DELETED
# Voice is now slot-managed through the Model Loader (SPRINT-VOICE-SLOTS).
# Voice models live in .userdata/models/voice/ and are registered as slots:
#   voice.tts.primary  (Orpheus, llama.cpp FFI)
#   voice.snac         (SNAC decoder, ort)
#   voice.tts.fallback (Kokoro, sherpa)
#   voice.stt          (Whisper small, sherpa)
#   voice.stt.upgrade  (Whisper turbo, sherpa, GPU)

# [services.system.grammar]
# Reserved for llguidance constrained decoding — future sprint.
# enabled = false
# kind = "llguidance"

[services.system.embedder]
# Candle-based dense text embedder — CPU burst mode.
# Used by CAG pipeline to generate vectors for RRO (Qdrant).
# Model: BERT-family (e.g. all-MiniLM-L6-v2, bge-small-en-v1.5).
# Download model files into .userdata/system/candle/embedder/ to enable.
enabled = false
critical = false
kind = "candle"
model_path = "system/candle/embedder"

[services.system.whisper]
# Candle-based Whisper ASR — CPU burst speech-to-text.
# Transcribes audio to text on demand (not streaming).
# Model: Whisper tiny/base/small (safetensors format).
# Download model files into .userdata/system/candle/whisper/ to enable.
enabled = false
critical = false
kind = "candle"
model_path = "system/candle/whisper"

[services.system.model_loader]
# AI model management — slot-based model registry, HuggingFace downloads,
# hardware detection, VRAM budgeting, inference backend routing.
# Always enabled — DevPulse ships with models, this manages them.
enabled = true
critical = false

[services.system.devforge]
# Managed VSCode/code-oss process — dedicated editor instance.
# Clone VSCode fork into deps/code-oss/ and build to enable.
enabled = false
critical = false
binary_path = "devforge/"
workspace_path = "."
port = 8443

# ── User services ────────────────────────────────────────────────
# User-owned data. Sessions, messages, tasks, preferences, personal memory.
# All auto-saved and auto-managed — the user never touches this config.

[services.user.relational]
enabled = true
critical = true
kind = "libsql"
path = "user/libsql/user.db"
retry = { max_retries = 5, base_delay_ms = 500 }

[services.user.graph]
enabled = true
critical = true
kind = "surreal"
path = "user/surreal/profile"
namespace = "user"
database = "profile"
system_user = "devpulse_engine"
system_password = "dp_usr_2026!"
retry = { max_retries = 5, base_delay_ms = 750 }

# ── Global services ──────────────────────────────────────────────
# Cross-project shared knowledge. Decisions, patterns, learnings.

[services.global.graph]
enabled = true
critical = true
kind = "surreal"
path = "global/surreal/knowledge"
namespace = "global"
database = "knowledge"
system_user = "devpulse_engine"
system_password = "dp_glb_2026!"
retry = { max_retries = 5, base_delay_ms = 750 }

# ── Project services ─────────────────────────────────────────────
# Per-project data lives under projects/{id}/ — created on demand.
# Config here defines the TEMPLATE for each new project namespace.

[services.project.graph]
enabled = true
critical = false
kind = "surreal"
# Path is a template: {project_id} replaced at runtime
path_template = "projects/{project_id}/surreal/context"
namespace = "project"
# Database name is the project ID, set at runtime

# ── Network services ─────────────────────────────────────────────
# Services that bind ports and serve network requests.
# Ports defined here are the SSOT — xtask, Vite, Tauri all derive from these.

[services.network.dev_server]
# Vite dev server — serves SvelteKit frontend during development.
# xtask injects this as DEVPULSE_DEV_PORT env var before spawning Vite.
# tauri.conf.json devUrl must match — xtask preflight verifies.
port = 1420
bind = "127.0.0.1"
strict_port = true

[services.network.graph_api]
# SurrealDB HTTP API — exposes the embedded graph store.
# External tools (Claude Code, surreal sql, scripts) connect here.
enabled = true
critical = true
port = 8822
bind = "127.0.0.1"

# ── Boot gate ────────────────────────────────────────────────────
# Controls when the UI is allowed to render.

[boot]
# When true, boot task will not emit "ready" until every critical
# service passes health check. Non-critical failures = degraded mode.
require_all_critical = true
timeout_secs = 60

# ── Windows hardening ────────────────────────────────────────────

[windows]
# Retry file operations on sharing violations (ERROR_SHARING_VIOLATION)
file_lock_retries = 5
file_lock_retry_delay_ms = 200
# Skip path canonicalization (avoids \\?\ extended-length prefix issues)
skip_canonicalize = true
# Use short paths for SurrealKV to avoid MAX_PATH (260 char) issues
max_path_depth = 200

# ══════════════════════════════════════════════════════════════════
# BUILD — single source of truth for the entire build toolchain
# ══════════════════════════════════════════════════════════════════
# xtask reads this section and sets all env vars / flags accordingly.
# .cargo/config.toml should contain ONLY the xtask alias.
# Everything else derives from here.

[build.toolchain]
target = "x86_64-pc-windows-msvc"
# CRT linkage — EVERY C/C++ dep MUST match. "static" = /MT, "dynamic" = /MD.
# If any dep ships a pre-built binary with a different CRT, it MUST be
# rebuilt from source or use load-dynamic.
msvc_crt = "static"

[build.deps.nasm]
# aws-lc-sys (SurrealDB transitive) needs NASM for x86_64 assembly
path = "deps/nasm/nasm.exe"
version = "3.01"
env = ["NASM", "AWS_LC_SYS_PREBUILT_NASM"]

[build.deps.python]
# outlines-core -> pyo3 for grammar constrained decoding
# NOTE: pyo3 removed from dep graph — outlines-core fork doesn't use it.
# Kept here for future use if pyo3 is re-added.
path = "deps/python/python.exe"
version = "3.14"
env = ["PYO3_PYTHON"]
extras = { PYO3_USE_ABI3_FORWARD_COMPATIBILITY = "1" }

[build.deps.cmake]
# VS 2026 Insiders ships cmake that requires this flag for old CMakeLists
path = "cmake"
env = []
extras = { CMAKE_POLICY_VERSION_MINIMUM = "3.5" }

# ort/ort-sys: owned fork at deps/ort/, patched via [patch.crates-io].
# Builds from source using local MSVC toolchain — no pre-built binaries.
# No env vars needed — the fork's build.rs handles everything.

[build.repos.rro]
url = "https://github.com/EonsofStupid/rro"
path = "deps/rro"
ref = "alpha"

[build.repos.wal]
url = "https://github.com/EonsofStupid/wal"
path = "deps/wal"
ref = "rro-alpha"

[build.repos.tar_rs]
url = "https://github.com/eonsofstupid/tar-rs"
path = "deps/tar-rs"
ref = "rro-alpha"

[build.repos.rust_stemmers]
url = "https://github.com/EonsofStupid/rust-stemmers"
path = "deps/rust-stemmers"
ref = "main"

[build.repos.surrealdb_src]
url = "https://github.com/surrealdb/surrealdb"
path = "deps/surrealdb-src"
ref = "main"

[build.repos.code_oss]
url = "https://github.com/eonsofstupid/vscode"
path = "deps/code-oss"
ref = "main"
