# Wizard Copy — Default
#
# All user-facing strings for the model setup wizard.
# Edit this file (or create an override at .userdata/config/wizard_copy.toml)
# to change copy without recompiling.
#
# Schema: systems/devpulse-engine/src/platform/wizard/copy.rs

# ─────────────────────────────────────────────────────────────────────
# Welcome screen — Clyffy greeting
# ─────────────────────────────────────────────────────────────────────
[greeting]
title = "Hey! I'm Clyffy."
subtitle = "I'll help you set up your AI models. It only takes a minute."
mascot_alt = "Clyffy mascot waving"
hint = "I'll recommend the best models for your hardware."
cta_label = "Let's Go"
cta_aria = "Start hardware scan and model setup"

# ─────────────────────────────────────────────────────────────────────
# Scanning state — shown during hardware detection
# ─────────────────────────────────────────────────────────────────────
