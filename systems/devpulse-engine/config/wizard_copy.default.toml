gpu_label = "GPU"
vram_label = "VRAM"
cpu_label = "CPU"
ram_label = "RAM"
disk_label = "Disk"

# Tooltips — structural explanations
gpu_tooltip = "Your graphics card. AI models run on GPU for fast inference. More VRAM = bigger models."
vram_tooltip = "Video RAM — dedicated GPU memory. Each AI model uses some. Green = room. Yellow = tight. Red = full."
cpu_tooltip = "Your processor. Fallback when GPU is full. Models run ~5-10x slower on CPU."
ram_tooltip = "System memory. Used for loading model files before GPU. 16GB+ ideal."
disk_tooltip = "Free storage. AI models are 1-10 GB each. Need at least 5GB for recommended setup."

