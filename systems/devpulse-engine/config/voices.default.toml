# Voice Registry — Single Source of Truth for TTS voice catalog
#
# This file is the SSOT for every voice available in the Voice UI. The
# frontend pulls this catalog at runtime via `list_voices()`; nothing about
# voices is hardcoded in Rust or Svelte.
#
# Override at `{userdata}/config/voices.toml` (same schema) — if present,
# it fully replaces this default instead of merging. That keeps overrides
# obvious and prevents partial-config confusion.
#
# Fields per voice:
#   id             — stable identifier consumed by the TTS engine
#   label          — human-friendly display name shown in the UI picker
#   gender         — "male" | "female" | "neutral" (drives UI filtering)
#   language       — BCP-47 tag, e.g. "en-US", "en-GB", "de-DE"
#   engine         — which TTS backend owns this voice: "kokoro" | "piper"
#   style          — freeform descriptor ("calm", "expressive", "news")
#   sample_text    — preview line played by the "Preview" button
#   description    — one-line blurb shown under the label

# ── Kokoro voices ─────────────────────────────────────────────────
# Kokoro is the primary TTS engine. Voice IDs below match the Kokoro v1.0
# style-embedding names (`af_*` = American female, `am_*` = American male,
# `bf_*` = British female, `bm_*` = British male).

[[voice]]
id = "af_heart"
label = "Clyffy"
gender = "female"
language = "en-US"
engine = "kokoro"
style = "warm"
sample_text = "Hi! I'm Clyffy, your AI assistant."
description = "Default assistant voice — warm and clear"

