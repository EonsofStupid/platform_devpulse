[package]
name = "devpulse-media"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Media pipeline for DevPulse — camera capture, background removal, composition, virtual camera output"

[features]
default = ["capture", "matting"]
capture = ["nokhwa"]
matting = []  # Background removal via Candle/ORT models
compositor = ["wgpu"]  # GPU-accelerated compositing (Phase 2)
virtual-cam = []  # Virtual camera output (Phase 2)
streaming = []  # RTMP/WebRTC output (Phase 3)

[dependencies]
# Core
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Camera capture (cross-platform)
nokhwa = { version = "0.10", features = ["input-msmf"], optional = true }

# Image processing
image = "0.25"

# GPU rendering (Phase 2)
wgpu = { version = "30.0.1", optional = true }

# Telemetry — supplies TracedSender/TracedReceiver (replaces raw flume)
# and `spawn_blocking` that preserves the current tracing span.
devpulse-telemetry = { workspace = true }

# Frame timing
chrono = { workspace = true }

# Audio file decode for voice-loop ingest (Whisper STT + Qwen3-TTS
# reference clips). rodio's Decoder delegates to symphonia/minimp3 for
# format support — wrapping it here keeps the dep transitive elsewhere.
rodio = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[lints]
workspace = true
