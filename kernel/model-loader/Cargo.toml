[package]
name = "model-loader"
version = "0.1.0"
edition = "2021"
description = "Self-enclosed model management crate — zero DevPulse dependencies"

[features]
default = ["candle-backend", "mode-dev"]
candle-backend = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
    "dep:image",
]
ort-backend = ["dep:ort", "dep:ndarray", "dep:rustfft"]
# Embedder + reranker — TBD, will use direct ort crate (avoids fastembed version conflict)
# Kokoro phonemization via espeak-ng C library — PRIMARY TTS path
espeak-phonemizer = ["dep:espeakng-sys"]
# Piper TTS — alternate TTS backend for A/B testing
piper-backend = ["dep:piper-rs"]
# Sherpa-onnx runtime backends — registry surfaced now, implementation later.
sherpa-backend = []
# llama.cpp FFI runtime — reserved feature flag for the planned GGUF path.
llama-cpp-ffi = []
nvml = ["dep:nvml-wrapper"]
cuda = ["candle-core/cuda"]
specta = ["dep:specta"]

# ── Build-mode selection (exactly one of the three must be active) ──
# `mode-dev` is the default so local cargo workflows behave as today.
# Release/customer builds swap it out via `--no-default-features`
# plus the chosen mode feature. See `src/build_mode.rs` for behaviour.
mode-dev = []
mode-production = []
mode-customer = []

[dependencies]
# Core (always)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
uuid = { version = "1.10", features = ["v5", "v7", "serde"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
flume = "0.11"
tokio = { version = "1", features = ["time"] }
sysinfo = "0.33"

# Specta (optional — Tauri TypeScript bindings)
specta = { version = "=2.0.0-rc.22", optional = true, features = ["derive"] }

# Candle inference (optional)
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }
hf-hub = { version = "0.4", optional = true }

# Image preprocessing for vision encoders (SigLIP2)
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png", "webp"] }

# Embedder + reranker — TBD: fastembed conflicts with workspace ort fork,
# will implement directly against the existing ort crate (whisper.rs pattern)

# Kokoro phonemizer — eSpeak NG FFI bindings (requires espeak-ng C library installed on system)
# Windows: vcpkg install espeak-ng  OR  prebuilt espeak-ng.dll on PATH
espeakng-sys = { version = "0.3", optional = true }

# Piper TTS — pure Rust alternate TTS backend (brings its own espeak-rs for phonemization)
piper-rs = { version = "0.1.9", optional = true }

# HTTP client for HuggingFace API search
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ONNX Runtime (optional — SNAC, Whisper, Kokoro)
ort = { workspace = true, optional = true }
ndarray = { version = "0.17", optional = true }

# FFT for Whisper mel spectrogram computation
rustfft = { version = "6.2", optional = true }

# GPU metrics (optional)
nvml-wrapper = { version = "0.10", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["time", "macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
