model_repo_id = "DevQuasar/microsoft.Phi-4-reasoning-vision-15B-GGUF"
model_filename = "microsoft.Phi-4-reasoning-vision-15B.f16.gguf.Q4_K_M.gguf"
model_size_mb = 9053
vram_estimate_mb = 10500
device = "Gpu"

[presets.slots.extensions]
mmproj_filename = "mmproj-microsoft.Phi-4-reasoning-vision-15B.f16.gguf"

[[presets.slots]]
slot_id = "minion.shared"
model_repo_id = "unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF"
model_filename = "Qwen3-30B-A3B-Instruct-2507-UD-Q4_K_XL.gguf"
model_size_mb = 0
vram_estimate_mb = 0
