# ── Common slots — inherited by every preset ───────────────────
#
# These entries are added to every preset's recommendation list
# unless a tier-specific entry with the same `slot_id` already
# exists. The loader handles the merge deterministically.
#
# rag.embedder uses Microsoft Harrier 0.6B (Qwen3-based encoder,
# optimised for retrieval, already on disk as microsoftharrier-oss-v1-0.6b).
# voice.wake added for the bundled sherpa-onnx KWS zipformer so
# 24/7 wake detection works out-of-the-box with no user config.
# voice.tts uses Kokoro English v0.19 — the same ONNX file the
# voice.tts slot already defaults to in slots.default.toml.

[[common.slots]]
slot_id = "rag.embedder"
model_repo_id = "microsoft/harrier-oss-v1-0.6b"
model_filename = "model.safetensors"
model_size_mb = 1136
vram_estimate_mb = 0
device = "Cpu"

