# ── Preset 3: Jesse Primary (16 GB) — Phi-4-rv-15B + Qwen3-TTS clone ──
#
# The owner's daily 16 GB loadout. Phi-4-reasoning-vision-15B GGUF
# (Q4_K_M) handles chat AND vision inline at ~10.5 GB GPU; Qwen3-TTS
# 0.6B safetensors at ~2.5 GB GPU drives the cloned-voice loop in
# real time (RTF ~0.5 on GPU). Total GPU steady-state ~13 GB +
# ~1.5 GB KV = ~14.5 GB peak on a 16 GB card with ~1.5 GB headroom.
#
# Composed STS pipeline (Whisper STT → Phi 15B → Qwen3-TTS) is the
# real STS today. Foundation-model duplex STS (PersonaPlex-7B / Phi-4-mm)
# stays in High/Ultra where it fits the 24 GB+ budget.
#
# `chat.fast` removed at this tier — Phi 15B handles all turns
# including quick routing, freeing 2.7 GB GPU for voice.tts. Heavy
# reasoning escalates to Claude API via the inference provider router
# (subscription turbo path).
#
# `minion.shared` ref-counts to `chat.brain` so minion tasks
# (routing, classification, tagging) get Phi-4-reasoning quality
# at zero extra VRAM. One load, two slots.
#
# `chat.vision` ref-counts to `chat.brain` because Phi-4-rv-15B is
# the unified reasoning + vision model — vision-specific calls hit
# the same weights.

[[presets]]
tier = "JessePrimary"
preset_name = "Jesse Primary (16GB) — Phi-4-rv-15B + Qwen3-TTS clone"
brain_policy = "Static"

# chat.brain — Phi-4-reasoning-vision-15B GGUF Q4_K_M + mmproj.
# Reasoning + vision in one model, llama.cpp FFI. Day-1 path on
# the GGUF backend; safetensors variant via mistral.rs scheduled
# when the Phi-4-Reasoning + SigLIP-2 mid-fusion arch lands there.
# vram_estimate ~10.5 GB; full GPU residence (no partial offload).
[[presets.slots]]
slot_id = "chat.brain"
model_repo_id = "DevQuasar/microsoft.Phi-4-reasoning-vision-15B-GGUF"
model_filename = "microsoft.Phi-4-reasoning-vision-15B.f16.gguf.Q4_K_M.gguf"
model_size_mb = 9053
vram_estimate_mb = 10500
device = "Gpu"

[presets.slots.extensions]
mmproj_filename = "mmproj-microsoft.Phi-4-reasoning-vision-15B.f16.gguf"

# chat.vision — ref-count to chat.brain. Phi-4-rv-15B is the
# unified reasoning + vision model; vision-specific calls reuse
# the same weights via BackendPool ref-count. Zero extra VRAM.
[[presets.slots]]
slot_id = "chat.vision"
model_repo_id = "DevQuasar/microsoft.Phi-4-reasoning-vision-15B-GGUF"
model_filename = "microsoft.Phi-4-reasoning-vision-15B.f16.gguf.Q4_K_M.gguf"
model_size_mb = 0
vram_estimate_mb = 0
device = "Gpu"

# minion.shared — ref-count to chat.brain (Phi-4-rv-15B). Routing,
# classification, tagging tasks reuse the brain weights at zero
# extra VRAM. Quality stays Phi-4-reasoning-tier across all minion
# work.
[[presets.slots]]
slot_id = "minion.shared"
model_repo_id = "DevQuasar/microsoft.Phi-4-reasoning-vision-15B-GGUF"
model_filename = "microsoft.Phi-4-reasoning-vision-15B.f16.gguf.Q4_K_M.gguf"
model_size_mb = 0
vram_estimate_mb = 0
device = "Gpu"

# rag.encoder — Harrier 0.6B on CPU for the RRO (Qdrant) query path.
# Same model as rag.embedder (common slot) — BackendPool ref-counts
# the underlying weights so there's only one copy in memory.
[[presets.slots]]
slot_id = "rag.encoder"
model_repo_id = "microsoft/harrier-oss-v1-0.6b"
model_filename = "model.safetensors"
model_size_mb = 1136
vram_estimate_mb = 0
device = "Cpu"

# minion.escalation — Phi-4-reasoning-plus Q4_K_M (14B Phi-3 arch).
# CPU fallback with disk mmap; loads on-demand for offline deep
# reasoning when Claude API isn't reachable. The 9 GB file streams
# from disk without filling RAM.
[[presets.slots]]
slot_id = "minion.escalation"
model_repo_id = "unsloth/Phi-4-reasoning-plus-GGUF"
model_filename = "Phi-4-reasoning-plus-Q4_K_M.gguf"
model_size_mb = 9053
vram_estimate_mb = 0
device = "Cpu"

