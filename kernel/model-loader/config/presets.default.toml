# ═══════════════════════════════════════════════════════════════
# PRESETS — Kernel SSOT
# ═══════════════════════════════════════════════════════════════
#
# Per-tier model recommendations. Absorbed from the hardcoded
# `preset_for_tier()` function in `hardware/auto_config.rs`.
#
# Each `[[presets]]` block describes one hardware tier's default
# configuration: a display name, a brain swap policy, and the list of
# slots it populates with a suggested model.
#
# The kernel loader at `hardware/presets.rs` parses this file at build
# time via `include_str!` and honours `{userdata}/config/presets.toml`
# as a user override (full-replace, same pattern as every other
# kernel-owned config file).
#
# ── Tier → preset mapping ──────────────────────────────────────
#
# `hardware/auto_config.rs::detect_tier` maps VRAM to a
# [`HardwareTier`] variant:
#
#   High         — 24 GB+     → Preset 4 (Static 14B brain)
#   JessePrimary — 16 GB      → Preset 3 (ActiveIdle Phi-4 15B / 4B)
#   Mid          — 10 GB+     → Preset 2 (ActiveIdle 9B / 4B)
#   Floor        —  8 GB      → Preset 1 (Static 4B brain)
#   Minimal      — <8 GB      → Preset 1 on CPU
#   CpuOnly      — no GPU     → Preset 1 on CPU
#
# The tier name in each `[[presets]]` block matches one of the
# enum variants above (case-sensitive).
#
# ── Brain swap policy values ───────────────────────────────────
#
#   brain_policy = "Static"
#
#   brain_policy = { ActiveIdle = {
#     active_model = "FileName.gguf",
#     idle_model = "FileName.gguf",
#     idle_after_secs = 300,
#   } }
#
#   brain_policy = "ApiEnhanced"
#
# ── Common slots ───────────────────────────────────────────────
#
# Every preset inherits the slots listed in `[common]` at the bottom
# of the file. Tier-specific slots override matching ids. Consumers
# rely on this split so "add a new voice slot" is one edit, not
# seven copy-paste edits across every preset.
#
# ── Extension pattern ──────────────────────────────────────────
#
# To add a new preset:
#
#   1. Add a new `HardwareTier` enum variant in `auto_config.rs`.
#   2. Append a `[[presets]]` block here with every slot the tier
#      should populate.
#   3. Update `detect_tier` to route hardware into the new variant.
#   4. Update the `list_all_presets` ordering helper.
#
# The wizard preset picker picks up the new preset automatically.
#
# ═══════════════════════════════════════════════════════════════

# ── Preset 5: Ultra (40 GB+) — Qwen3-VL-30B-A3B MoE omni brain ─
#
# Top tier for users with 40+ GB of VRAM (RTX 5090, A6000, dual-GPU).
# Uses the vision-language MoE variant so the same 30B handles chat
# + vision inline — one model, two capabilities, one VRAM reservation.
# Qwen3-30B-A3B is Mixture-of-Experts with ~3 B active per token, so
# inference speed is close to a 4 B dense model while reasoning
# quality approaches a 30 B dense model. Static load, full GPU
# (ngl = -1), warm standby.
#
# Voice stack: Moshi 7B (8 GB) always-hot voice.brain for 24/7 STS.
# The 30B-VL fills the heavy-reasoning and vision roles; Moshi owns
# the voice loop. Total peak ~30 GB VRAM — fits 40 GB with headroom.

[[presets]]
tier = "Ultra"
preset_name = "Ultra (40GB+) — 30B-A3B VL + Moshi STS"
brain_policy = "Static"

# chat.brain — Qwen3-VL-30B-A3B omni. Full GPU load, no partial
# offload needed at 40 GB+ (ngl = -1 implicit).
[[presets.slots]]
slot_id = "chat.brain"
model_repo_id = "unsloth/Qwen3-VL-30B-A3B-Instruct-GGUF"
model_filename = "Qwen3-VL-30B-A3B-Instruct-UD-Q4_K_XL.gguf"
model_size_mb = 18500
vram_estimate_mb = 20500
device = "Gpu"

# chat.fast — Qwen3-4B routing brain stays hot even on Ultra so
# quick turns don't pay the full 30B MoE gating latency.
[[presets.slots]]
slot_id = "chat.fast"
model_repo_id = "Qwen/Qwen3-4B-Instruct-GGUF"
model_filename = "Qwen3-4B-Instruct-Q4_K_M.gguf"
model_size_mb = 2500
vram_estimate_mb = 2700
device = "Gpu"

# chat.vision — Phi-4-reasoning-vision-15B GGUF + mmproj. Dedicated
# reasoning vision model; pairs with chat.brain (VL-30B-A3B) for the
# omni stack. Loads via llama.cpp FFI — phi4-siglip arch isn't covered
# by Candle's arch-native loaders. The mmproj projection is a separate
# file llama.cpp reads alongside the main GGUF.
[[presets.slots]]
slot_id = "chat.vision"
model_repo_id = "DevQuasar/microsoft.Phi-4-reasoning-vision-15B-GGUF"
model_filename = "microsoft.Phi-4-reasoning-vision-15B.f16.gguf.Q4_K_M.gguf"
model_size_mb = 9053
vram_estimate_mb = 10500
device = "Gpu"

[presets.slots.extensions]
mmproj_filename = "mmproj-microsoft.Phi-4-reasoning-vision-15B.f16.gguf"

[[presets.slots]]
slot_id = "minion.shared"
model_repo_id = "unsloth/Qwen3-VL-30B-A3B-Instruct-GGUF"
model_filename = "Qwen3-VL-30B-A3B-Instruct-UD-Q4_K_XL.gguf"
model_size_mb = 0
vram_estimate_mb = 0
device = "Gpu"

# minion.escalation — Phi-4-reasoning-plus GGUF Q4_K_M. Deep-reasoning
# brain that escalates from chat.fast on hard queries. 14B Phi-3-arch
# loads via Candle's arch-native quantized_phi3 path.
[[presets.slots]]
slot_id = "minion.escalation"
model_repo_id = "unsloth/Phi-4-reasoning-plus-GGUF"
model_filename = "Phi-4-reasoning-plus-Q4_K_M.gguf"
model_size_mb = 9053
vram_estimate_mb = 9500
device = "Gpu"

[[presets.slots]]
slot_id = "rag.encoder"
model_repo_id = "microsoft/harrier-oss-v1-0.6b"
model_filename = "model.safetensors"
model_size_mb = 1136
vram_estimate_mb = 0
device = "Cpu"

# voice.brain — Personaplex-7B (NVIDIA, moshi-architecture, audio-to-audio).
# 16.7 GB BF16 weights fit comfortably on 40 GB+ tier. Replaces the prior
# Kyutai Moshi 7B entry — Personaplex is the same arch family with better
# tuning. Loaded via the moshi-sts Candle feature.
[[presets.slots]]
slot_id = "voice.brain"
model_repo_id = "nvidia/personaplex-7b-v1"
model_filename = "model.safetensors"
model_size_mb = 16742
vram_estimate_mb = 17500
device = "Gpu"

# ── Preset 4: High (24 GB) — Qwen3-30B-A3B text + Qwen3-VL-8B ──
#
# 24 GB rigs (RTX 3090, 4090, 7900 XTX) get the text-only 30B-A3B
# with full GPU load plus a dedicated Qwen3-VL-8B for vision tasks.
# Moshi 7B stays always-hot as voice.brain. Minions share the 30B
# via BackendPool ref-count so there's no duplicate load.
#
# Peak VRAM: 30B-A3B (18 GB) + Moshi (8 GB) = 26 GB — slightly over,
# so 30B-A3B runs with ngl = 50 (partial offload) to keep headroom
# for KV cache + vision-on-demand. The ActiveIdle policy swaps Moshi
# out when a complex query fires to free up VRAM for full 30B load.

[[presets]]
tier = "High"
preset_name = "High (24GB) — 30B-A3B + Moshi STS"

[presets.brain_policy.ActiveIdle]
active_model = "Qwen3-30B-A3B-Instruct-2507-UD-Q4_K_XL.gguf"
idle_model = "Qwen3-4B-Instruct-Q4_K_M.gguf"
idle_after_secs = 300

# chat.brain — full 30B-A3B on GPU, all layers in VRAM (ngl = -1).
# 24 GB is enough to host the 30B + Moshi + chat.fast + chat.vision
# without partial offload, so no `llama_cpp_ngl` extension here.
[[presets.slots]]
slot_id = "chat.brain"
model_repo_id = "unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF"
model_filename = "Qwen3-30B-A3B-Instruct-2507-UD-Q4_K_XL.gguf"
model_size_mb = 17700
vram_estimate_mb = 18500
device = "Gpu"

[[presets.slots]]
slot_id = "chat.fast"
model_repo_id = "Qwen/Qwen3-4B-Instruct-GGUF"
model_filename = "Qwen3-4B-Instruct-Q4_K_M.gguf"
model_size_mb = 2500
vram_estimate_mb = 2700
device = "Gpu"

# chat.vision — Phi-4-reasoning-vision-15B on 24 GB. Dedicated
# reasoning + vision brain; pairs with the Qwen3-30B-A3B chat.brain
# for omni capability without the unified-model VRAM cost. Loaded
# via llama.cpp FFI; mmproj projection is published alongside the
# main GGUF in the DevQuasar repo.
[[presets.slots]]
slot_id = "chat.vision"
model_repo_id = "DevQuasar/microsoft.Phi-4-reasoning-vision-15B-GGUF"
model_filename = "microsoft.Phi-4-reasoning-vision-15B.f16.gguf.Q4_K_M.gguf"
model_size_mb = 9053
vram_estimate_mb = 10500
device = "Gpu"

[presets.slots.extensions]
mmproj_filename = "mmproj-microsoft.Phi-4-reasoning-vision-15B.f16.gguf"

[[presets.slots]]
slot_id = "minion.shared"
model_repo_id = "unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF"
model_filename = "Qwen3-30B-A3B-Instruct-2507-UD-Q4_K_XL.gguf"
model_size_mb = 0
vram_estimate_mb = 0
device = "Gpu"

# minion.escalation — Phi-4-reasoning-plus GGUF Q4_K_M (14B, ~9 GB).
# Deep-reasoning brain reachable from chat.fast on hard queries.
# Active-idle pattern keeps it warm but not always-loaded so 24 GB
# can host the omni stack alongside it.
[[presets.slots]]
slot_id = "minion.escalation"
model_repo_id = "unsloth/Phi-4-reasoning-plus-GGUF"
model_filename = "Phi-4-reasoning-plus-Q4_K_M.gguf"
model_size_mb = 9053
vram_estimate_mb = 9500
device = "GpuWithCpuFallback"

[[presets.slots]]
slot_id = "rag.encoder"
model_repo_id = "microsoft/harrier-oss-v1-0.6b"
model_filename = "model.safetensors"
model_size_mb = 1136
vram_estimate_mb = 0
device = "Cpu"

# voice.brain — Personaplex-7B BF16 (16.7 GB). Replaces the prior
# Kyutai Moshi entry — same moshi arch family, better tuning. The
# active-idle pattern with chat.brain (30B-A3B) handles the 24 GB
# budget pressure: when chat.brain expands to full ngl, voice.brain
# drops to KV-cache-only state.
[[presets.slots]]
slot_id = "voice.brain"
model_repo_id = "nvidia/personaplex-7b-v1"
model_filename = "model.safetensors"
model_size_mb = 16742
vram_estimate_mb = 17500
device = "Gpu"

# ── Preset 3: Jesse Primary (16 GB) — 30B-A3B partial + Moshi ──
#
# The flagship 16 GB loadout the owner runs daily. Qwen3-30B-A3B
# Q4_K_XL is 17.7 GB but runs on 17.5 GB VRAM per Unsloth — we
# shave the last 1.5 GB via `llama_cpp_ngl = 50` (50 GPU layers,
# rest on CPU RAM with mmap). MoE gating keeps only the active
# experts resident so steady-state VRAM stays around 12-14 GB.
#
# Voice stack: Moshi 7B int8 (8 GB) as the 24/7 full-duplex voice
# brain. When the user asks a complex question through voice, Moshi
# hands the text off to chat.brain, which spin-loads the 30B weights
# into its ngl=50 partition, answers, hands the response back to
# Moshi for synthesis. Peak VRAM during escalation is tight but
# manageable because Moshi shrinks its KV cache during the handoff.
#
# minion.shared shares the 30B-A3B weights via BackendPool ref-count
# so minion tasks (routing, classification, tagging) get MoE-scale
# quality at ~4 B effective compute per token. One load, two slots.

[[presets]]
tier = "JessePrimary"
preset_name = "Jesse Primary (16GB) — 30B-A3B partial + Moshi STS"
brain_policy = "Static"

# chat.brain — Qwen3-30B-A3B with llama.cpp partial offload.
# `llama_cpp_ngl = "50"` in the slot extensions drops 50 GPU layers
# into VRAM and mmaps the rest on CPU / NVMe. The `vram_estimate_mb`
# reflects the steady-state reservation with MoE expert gating, not
# the full 17.7 GB file size.
[[presets.slots]]
slot_id = "chat.brain"
model_repo_id = "unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF"
model_filename = "Qwen3-30B-A3B-Instruct-2507-UD-Q4_K_XL.gguf"
model_size_mb = 17700
vram_estimate_mb = 13500
device = "GpuWithCpuFallback"

[presets.slots.extensions]
llama_cpp_ngl = "50"

# chat.fast — Qwen3-4B Q4_K_M always-hot routing brain. Handles
# quick turns, routing decisions, classification, and short minion
# tasks so the big 30B stays warm for heavy reasoning. ~2.5 GB VRAM
# fits comfortably alongside Moshi (8 GB) and the 30B partial
# offload's 13.5 GB steady-state reservation on the 16 GB rig.
[[presets.slots]]
slot_id = "chat.fast"
model_repo_id = "Qwen/Qwen3-4B-Instruct-GGUF"
model_filename = "Qwen3-4B-Instruct-Q4_K_M.gguf"
model_size_mb = 2500
vram_estimate_mb = 2700
device = "Gpu"

# chat.vision — Qwen3-VL-2B Q4_K_M on-demand. Loads on the
# `image.pasted` signal, unloads after idle. Paired with its mmproj
# vision encoder via the `mmproj_filename` slot extension (llama.cpp
# reads both files). Smaller than Qwen3-VL-8B so it fits in the
# leftover VRAM budget when Moshi + 30B partial + 4B are all resident.
[[presets.slots]]
slot_id = "chat.vision"
model_repo_id = "Qwen/Qwen3-VL-2B-Instruct-GGUF"
model_filename = "Qwen3-VL-2B-Instruct-Q4_K_M.gguf"
model_size_mb = 1600
vram_estimate_mb = 1800
device = "Gpu"

[presets.slots.extensions]
mmproj_filename = "mmproj-Qwen3-VL-2B-Instruct-F16.gguf"

# minion.shared — shares chat.fast (4B) via BackendPool ref-count.
# `model_size_mb = 0` + `vram_estimate_mb = 0` tells the budgeter
# this slot is a reference, not a duplicate load. The 4B routing
# brain handles minion work without needing its own copy in VRAM.
[[presets.slots]]
slot_id = "minion.shared"
model_repo_id = "Qwen/Qwen3-4B-Instruct-GGUF"
model_filename = "Qwen3-4B-Instruct-Q4_K_M.gguf"
model_size_mb = 0
vram_estimate_mb = 0
device = "Gpu"

# rag.encoder — Harrier 0.6B on CPU for the RRO (Qdrant) query path.
# Same model as rag.embedder — BackendPool ref-counts the underlying
# weights so there's only one copy in memory.
[[presets.slots]]
slot_id = "rag.encoder"
model_repo_id = "microsoft/harrier-oss-v1-0.6b"
model_filename = "model.safetensors"
model_size_mb = 1136
vram_estimate_mb = 0
device = "Cpu"

# voice.brain — Phi-4-multimodal-instruct (5.6B params, ~11 GB raw
# safetensors, ISQ4 ~3-4 GB) loaded via mistral.rs. The rotation pair
# for the High/Ultra Personaplex-7B entry — Personaplex's 16.7 GB BF16
# doesn't fit a 16 GB rig, so JessePrimary (and below) takes the
# smaller Phi-4-mm path. Vision + audio + text in one model.
[[presets.slots]]
slot_id = "voice.brain"
model_repo_id = "microsoft/Phi-4-multimodal-instruct"
model_filename = "model.safetensors.index.json"
model_size_mb = 11149
vram_estimate_mb = 4500
device = "GpuWithCpuFallback"

[presets.slots.extensions]
mistralrs_isq = "Q4_0"

# minion.escalation — Phi-4-reasoning-plus Q4_K_M (14B Phi-3 arch).
# CPU fallback because the 16 GB tier's GPU is already booked by the
# 30B-A3B partial offload + voice.brain. Loads on-demand with mmap
# so the 9 GB file streams from disk without filling RAM.
[[presets.slots]]
slot_id = "minion.escalation"
model_repo_id = "unsloth/Phi-4-reasoning-plus-GGUF"
model_filename = "Phi-4-reasoning-plus-Q4_K_M.gguf"
model_size_mb = 9053
vram_estimate_mb = 0
device = "Cpu"

