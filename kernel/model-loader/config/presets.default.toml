# ═══════════════════════════════════════════════════════════════
# PRESETS — Kernel SSOT
# ═══════════════════════════════════════════════════════════════
#
# Per-tier model recommendations. Absorbed from the hardcoded
# `preset_for_tier()` function in `hardware/auto_config.rs`.
#
# Each `[[presets]]` block describes one hardware tier's default
# configuration: a display name, a brain swap policy, and the list of
# slots it populates with a suggested model.
#
# The kernel loader at `hardware/presets.rs` parses this file at build
# time via `include_str!` and honours `{userdata}/config/presets.toml`
# as a user override (full-replace, same pattern as every other
# kernel-owned config file).
#
# ── Tier → preset mapping ──────────────────────────────────────
#
# `hardware/auto_config.rs::detect_tier` maps VRAM to a
# [`HardwareTier`] variant:
#
#   High         — 24 GB+     → Preset 4 (Static 14B brain)
#   JessePrimary — 16 GB      → Preset 3 (ActiveIdle Phi-4 15B / 4B)
#   Mid          — 12 GB      → Preset 2 (ActiveIdle 9B / 4B)
#   Floor        —  8 GB      → Preset 1 (Static 4B brain)
#   Minimal      — <8 GB      → Preset 1 on CPU
#   CpuOnly      — no GPU     → Preset 1 on CPU
#
# The tier name in each `[[presets]]` block matches one of the
# enum variants above (case-sensitive).
#
# ── Brain swap policy values ───────────────────────────────────
#
#   brain_policy = "Static"
#
#   brain_policy = { ActiveIdle = {
#     active_model = "FileName.gguf",
#     idle_model = "FileName.gguf",
#     idle_after_secs = 300,
#   } }
#
#   brain_policy = "ApiEnhanced"
#
# ── Common slots ───────────────────────────────────────────────
#
# Every preset inherits the slots listed in `[common]` at the bottom
# of the file. Tier-specific slots override matching ids. Consumers
# rely on this split so "add a new voice slot" is one edit, not
# seven copy-paste edits across every preset.
#
# ── Extension pattern ──────────────────────────────────────────
#
# To add a new preset:
#
#   1. Add a new `HardwareTier` enum variant in `auto_config.rs`.
#   2. Append a `[[presets]]` block here with every slot the tier
#      should populate.
#   3. Update `detect_tier` to route hardware into the new variant.
#   4. Update the `list_all_presets` ordering helper.
#
# The wizard preset picker picks up the new preset automatically.
#
# ═══════════════════════════════════════════════════════════════

# ── Preset 5: Ultra (40 GB+) — Qwen3-30B-A3B MoE brain ────────
#
# Top tier for users with 40+ GB of VRAM (RTX 5090, A6000, dual-GPU
# setups). Qwen3-30B-A3B is a Mixture-of-Experts model — 30 B total
# parameters but only ~3 B active per token, so inference speed is
# close to a 4 B dense model while reasoning quality approaches a
# 30 B dense model. Static load, no ActiveIdle needed.

[[presets]]
tier = "Ultra"
preset_name = "Ultra (40GB+) — 30B MoE"
brain_policy = "Static"

[[presets.slots]]
slot_id = "chat.brain"
model_repo_id = "bartowski/Qwen3-30B-A3B-Instruct-GGUF"
model_filename = "Qwen3-30B-A3B-Instruct-Q4_K_M.gguf"
model_size_mb = 18500
vram_estimate_mb = 20500
device = "Gpu"

[[presets.slots]]
slot_id = "minion.shared"
model_repo_id = "Qwen/Qwen3-0.6B-GGUF"
model_filename = "qwen3-0.6b-q8_0.gguf"
model_size_mb = 700
vram_estimate_mb = 400
device = "Gpu"

