# vision.embedder — SigLIP2 SO400M patch16-512 ("HD"). 4.55 GB
# safetensors on CPU/DRAM. Higher resolution + finer patches than
# the patch14-384 variant — better localization for image retrieval
# and dense features. Used by `vision.embedder` consumers (RRO image
# index, vision-search). Locked as the HD default per the canonical
# vision-embedder requirement.
[[common.slots]]
slot_id = "vision.embedder"
model_repo_id = "google/siglip2-so400m-patch16-512"
model_filename = "model.safetensors"
model_size_mb = 4550
vram_estimate_mb = 0
device = "Cpu"

[[common.slots]]
slot_id = "voice.stt"
model_repo_id = "ggerganov/whisper.cpp"
model_filename = "ggml-small.bin"
model_size_mb = 466
vram_estimate_mb = 0
device = "Cpu"

# voice.tts — Qwen3-TTS-12Hz-0.6B-Base. Single TTS engine for both
# default Clyffy voice and zero-shot voice cloning from a user-uploaded
# reference clip (3-10 sec mp3/wav). Apache 2.0; loaded via Candle
# through the `qwen3-tts` crate (TrevorS/qwen3-tts-rs).
#
# Two safetensors files in the repo, both mandatory: `model.safetensors`
# (1.83 GB talker LM) + `speech_tokenizer/model.safetensors` (682 MB
# neural codec). Total disk + memory ~2.52 GB. The codec is bundled
# in the same repo; no separate vocoder.
#
# Output: f32 PCM mono 24 kHz — drops directly into rodio playback.
# Reference audio input: 24 kHz mono (resample upstream via rubato).
# ICL cloning on the Base variant requires the reference clip's
# transcript alongside the audio (`VoiceCloneEntry.reference_text`).
#
# Device = "GpuWithCpuFallback": GPU residence (~2.5 GB) gives RTF
# ~0.5 (real-time conversational); CPU fallback runs RTF ~4.5 which
# is offline-batch-only — wake-word loop stutters on CPU. The runtime
# budgeter picks GPU when fits (e.g. JessePrimary 16 GB rig with
# Phi 15B already resident has ~3 GB headroom for voice.tts on GPU).
[[common.slots]]
slot_id = "voice.tts"
model_repo_id = "Qwen/Qwen3-TTS-12Hz-0.6B-Base"
model_filename = "model.safetensors"
model_size_mb = 1830
# vram_estimate_mb stays 0: the canonical lane in slots.default.toml is
# CPU. When the runtime budgeter detects free GPU headroom on a tier
# that can afford it (e.g. JessePrimary 16 GB rig with Phi 15B already
# resident has ~3 GB free), the per-load device picker promotes voice.tts
# to GPU at request time. Preset-time VRAM accounting stays canonical
# so Floor/Minimal tiers don't lose budget to a GPU residency that
# never happens for their hardware.
vram_estimate_mb = 0
device = "GpuWithCpuFallback"

[common.slots.extensions]
codec_filename = "speech_tokenizer/model.safetensors"

[[common.slots]]
slot_id = "voice.wake"
model_repo_id = "k2-fsa/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20"
model_filename = "encoder-epoch-99-avg-1.int8.onnx"
model_size_mb = 12
vram_estimate_mb = 0
device = "Cpu"
