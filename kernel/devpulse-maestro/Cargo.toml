[package]
name = "devpulse-maestro"
version = "0.1.0"
edition = "2021"

[features]
default = []
rro = ["dep:rro"]
kokoros = ["dep:kokoros"]
outlines = ["dep:outlines-core"]

[dependencies]
# Core
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }

# Persistence Layer
libsql = { workspace = true }
duckdb = { workspace = true }
surrealdb = { workspace = true }
moka = { workspace = true }
rro = { workspace = true, optional = true }
kokoros = { workspace = true, optional = true }
outlines-core = { workspace = true, optional = true }

# Observability
tracing = { workspace = true }

# Async traits
async-trait = "0.1"

[lints]
workspace = true
