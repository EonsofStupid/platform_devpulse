[package]
name = "devpulse-clyffy"
version = "0.1.0"
edition = "2021"

[features]
default = []
rro = ["dep:rro"]
# Reserved for llguidance constrained decoding — fork not yet cloned
# outlines = ["dep:llguidance"]
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]
model-loader = ["dep:model-loader", "model-loader/specta"]
guardian = [
    "dep:streaming-iterator",
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:tree-sitter-c",
]

[dependencies]
# Core
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }

# Persistence Layer
libsql = { workspace = true }
duckdb = { workspace = true }
surrealdb = { workspace = true }
moka = { workspace = true }
rro = { workspace = true, optional = true }
# llguidance = { workspace = true, optional = true }  # TODO: wire when fork is ready

# Candle inference (CPU-first, burst mode)
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }
hf-hub = { version = "0.4", optional = true, default-features = false, features = ["tokio"] }

# Observability
tracing = { workspace = true }

# Model Loader (self-enclosed, zero clyffy deps — re-exported for engine)
model-loader = { path = "../model-loader", optional = true, features = ["candle-backend", "ort-backend", "nvml"] }

# Async traits
async-trait = "0.1"

# AST Analysis — GUARDIAN security scanner + refactoring safety (tree-sitter)
streaming-iterator = { version = "0.1", optional = true }
tree-sitter = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }

[lints]
workspace = true
