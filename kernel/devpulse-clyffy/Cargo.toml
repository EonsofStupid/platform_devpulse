[package]
name = "devpulse-clyffy"
version = "1.0.1"
edition = "2021"

[features]
default = []
rro = ["dep:rro"]
# Upstream constrained-decoding engine (crates.io); enable for full grammar runtime.
llguidance = ["dep:llguidance"]
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]
# Burn-backed authorship for the RRO encoder. `burn-cpu` selects Burn's
# Flex CPU backend (Burn 0.21 PR #4761 — the new default CPU backend,
# replaces NdArray for new authorship). Storage dtype is set at boot via
# `burn::tensor::set_default_dtypes(FloatDType::BF16, IntDType::I64)` —
# the Flex generic params are phantom in 0.21 so we don't pin bf16 via
# the type; we pin it via runtime DType. `burn-cuda` adds the CUDA
# runtime dep (CUDA 12 toolkit required) and DOES pin bf16 via the
# generic (`Cuda<bf16>` works because `FloatElement` impls bf16).
#
# `arc-swap` and `static_assertions` are pulled in by the burn features
# specifically — the hot-update pattern (`HOT_UPDATE_PATTERN.md` §12)
# needs `assert_impl_all!(BurnEmbedder<B>: Send, Sync, 'static)` and
# the ArcSwap round-trip test, both of which only compile when the
# encoder code itself is compiled.
burn-cpu = ["dep:burn", "burn/flex", "dep:arc-swap", "dep:static_assertions", "dep:safetensors", "dep:rrd", "dep:model-loader", "dep:tokenizers"]
burn-cuda = ["dep:burn", "burn/cuda", "dep:arc-swap", "dep:static_assertions", "dep:safetensors", "dep:rrd", "dep:model-loader", "dep:tokenizers"]
# Cross-vendor GPU via wgpu/Vulkan backend — runs on AMD + NVIDIA + Intel +
# Apple. Slightly slower than `burn-cuda` on NVIDIA but the only GPU path on
# AMD/Intel. Requires Vulkan SDK at build time; runtime loads the system's
# `vulkan-1.dll` (every modern GPU driver ships one).
burn-wgpu = ["dep:burn", "burn/wgpu", "dep:arc-swap", "dep:static_assertions", "dep:safetensors", "dep:rrd", "dep:model-loader", "dep:tokenizers"]
# Model-loader types + hardware sampling (NVML) with no inference backend.
# Always linked by the engine: hardware stats, slots and registry types do
# not depend on candle/ort being compiled in.
model-loader-core = [
    "dep:model-loader",
    "model-loader/specta",
    "model-loader/nvml",
]
# Full model-loader including the compiled-in inference backends.
model-loader = [
    "model-loader-core",
    "model-loader/candle-backend",
    "model-loader/ort-backend",
]
# ── GPU backend proxies for the consumed model-loader crate ──
# Cargo features can only chain one level deep (`dep/feature`, not
# `dep/dep/feature`), so engine-level GPU proxies route through clyffy here.
model-loader-cuda = ["model-loader", "model-loader/cuda"]
model-loader-mkl = ["model-loader", "model-loader/mkl"]
model-loader-llama-cuda = ["model-loader", "model-loader/llama-cpp-cuda"]
model-loader-llama-vulkan = ["model-loader", "model-loader/llama-cpp-vulkan"]
# Tauri IPC type derivation. Enable when this crate is consumed by the
# Tauri facade (engine + desktop). Off by default so kernel-only builds
# don't drag specta into their dep tree.
specta = ["dep:specta"]
guardian = [
    "dep:streaming-iterator",
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:tree-sitter-c",
]

[dependencies]
# Core
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }

# Persistence Layer
base64 = "0.22"
libsql = { workspace = true }
duckdb = { workspace = true }
surrealdb = { workspace = true }
moka = { workspace = true }
rro = { workspace = true, optional = true }
llguidance = { workspace = true, optional = true }

# HTTP client for managed sidecars (Ollama, SurrealDB) —
# rustls-tls avoids a system OpenSSL dep on Windows/Linux release builds.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# rkyv 0.8 — zero-copy serialization. Backs `RroRecord` (the JIT
# precomputed-context shape) under
# `src/cortex/persistence/surreal/intelligence.rs`. Always-on (not
# feature-gated): the type definitions and the access helper are part
# of the always-compiled persistence surface so consumers downstream
# (engine MCP server, future hooks) can reference them without juggling
# a feature gate.
rkyv = { workspace = true }

# Candle inference (CPU-first, burst mode)
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }
hf-hub = { version = "0.4", optional = true, default-features = false, features = ["tokio"] }

# Burn — RRO encoder authorship target. Optional; gated through
# `burn-cpu` and `burn-cuda` features above. Default-features inherited
# from the workspace dep (`std` only) so each consuming feature picks
# its own backend without dragging others in.
burn = { workspace = true, optional = true }

# Atomic Arc swap for the encoder hot-update pattern
# (`HOT_UPDATE_PATTERN.md` §4.1, H1). Pulled in alongside Burn — the
# encoder is the canonical user, no other path in this crate touches it.
arc-swap = { workspace = true, optional = true }

# Compile-time `Send + Sync + 'static` assertions per backend
# (`HOT_UPDATE_PATTERN.md` §7.1, H6). Burn's `Module` trait declares
# only `Clone + Send + Debug`; backends are Sync in practice but we
# encode that contract at the assertion site, not silently.
static_assertions = { workspace = true, optional = true }

# Safetensors loader for the Burn embedder (`HOT_UPDATE_PATTERN.md`
# §5 HotUpdateable). Reads HF weights into raw `Tensor<B, ?>` fields
# via std::fs::read (mmap is `unsafe` and the crate-wide unsafe-code
# deny lint disallows it without an explicit allow). Pulled in
# alongside Burn — the encoder is the only consumer in this crate.
safetensors = { version = "0.4", optional = true }

# RRD daemon trait surface — `HotUpdateable` impl on `BurnEmbedder<B>`
# is the entry point that lets the daemon manage encoder hot-updates.
rrd = { path = "../rrd", optional = true }

# Observability
tracing = { workspace = true }
# Context-propagating broadcast channels (ADR-002) — required by
# cortex::reasoning::state::RroStateHandle and cortex::llguidance::handle::GrammarHandle
# to fan transition snapshots out to dev tools without losing OTel context.
devpulse-telemetry = { workspace = true }

# Kernel SSOT TOML loaders (interaction templates, minion routing, etc.)
toml = "0.9"

# Model Loader (self-enclosed, zero clyffy deps — re-exported for engine).
# Default-features = false so a feature like `burn-cpu` can pull in just the
# trait surface (`backends::burn_adapter`, `loading::states::MemoryFootprint`)
# without dragging llama-cpp-sys / candle / ort. The full backend surface is
# pulled by the `model-loader` feature alias below.
model-loader = { path = "../model-loader", optional = true, default-features = false }
# `llama-cpp-ffi` is ON. cmake + MSVC are wired through the SSOT at
# `config/platform/build/deps.toml [build.deps.{cmake,ninja}]`; xtask's
# `apply_env` sets `CMAKE` / `CMAKE_MAKE_PROGRAM` / `CMAKE_GENERATOR`
# before invoking cargo. Build via `cargo xtask verify` / `run-dev` /
# `build-release`. Direct `cargo check` from a shell without that env
# will fail at the llama-cpp-sys-2 build script — that's expected; the
# SSOT is the entry point.

# Async traits
async-trait = "0.1"

# Optional: Tauri IPC type derivation (enabled via the `specta` feature).
specta = { workspace = true, optional = true }

# AST Analysis — GUARDIAN security scanner + refactoring safety (tree-sitter)
streaming-iterator = { version = "0.1", optional = true }
tree-sitter = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }

[lints]
workspace = true
