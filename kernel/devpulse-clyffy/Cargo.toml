[package]
name = "devpulse-clyffy"
version = "0.1.0"
edition = "2021"

[features]
default = []
rro = ["dep:rro"]
kokoros = ["dep:kokoros"]
# TODO: swap outlines-core → llguidance when fork is cloned to ../deps/llguidance
outlines = ["dep:outlines-core"]
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]

[dependencies]
# Core
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }

# Persistence Layer
libsql = { workspace = true }
duckdb = { workspace = true }
surrealdb = { workspace = true }
moka = { workspace = true }
rro = { workspace = true, optional = true }
kokoros = { workspace = true, optional = true }
outlines-core = { workspace = true, optional = true }

# Candle inference (CPU-first, burst mode)
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }
hf-hub = { version = "0.4", optional = true, default-features = false, features = ["tokio"] }

# Observability
tracing = { workspace = true }

# Async traits
async-trait = "0.1"

[lints]
workspace = true
