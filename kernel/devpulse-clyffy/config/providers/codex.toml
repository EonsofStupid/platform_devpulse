# Codex CLI — OpenAI's coding agent, used through your ChatGPT plan or an API
# key. Facts checked 2026-10-20 against github.com/openai/codex, the
# developer-commands docs and the official install scripts.

# What it is (name, docs, how DevPulse talks to it) is its registry row in
# kernel/devpulse-clyffy/src/providers/registry.rs; this file is where this
# machine keeps it.
id = "codex"

[detect]
executables = ["codex"]
# The official installer's locations, when they are not on PATH.
paths = { windows = ["%LOCALAPPDATA%/Programs/OpenAI/Codex/bin/codex.exe"], macos = ["~/.local/bin/codex"], linux = ["~/.local/bin/codex"] }

[version]
# Prints "codex-cli 0.163.0".
args = ["--version"]

[latest]
npm = "@openai/codex"

[signed_in]
# "exit with 0 when logged in"; prints "Not logged in" otherwise.
args = ["login", "status"]
output_signed_in = "Logged in"
output_signed_out = "Not logged in"

[sign_in]
args = ["login"]

[update]
args = ["update"]

[install]
# Install on click (plan 0001 B3.10): OpenAI's own npm package, into the
# DevPulse folder (npm install --prefix; it needs Node.js). Checked
# 2026-10-24 against the npm registry and the Codex README.
npm = "@openai/codex"
bin = "codex"

[connect]
# Codex has no ACP mode of its own. The protocol maintainers' connector
# (github.com/agentclientprotocol/codex-acp) speaks ACP for it; CODEX_PATH
# makes it run your Codex, under your own login, instead of the copy it
# bundles. Checked 2026-10-20 against codex-acp 2.2.2.
env = { CODEX_PATH = "{program}" }
connector = { npm = "@agentclientprotocol/codex-acp", bin = "codex-acp" }
# Your notes for a new session (plan 0001 B6.3): the connector merges CODEX_CONFIG
# into the session's config, and Codex keeps its developer_instructions in front
# of the model. It takes them only when a thread starts: a real resumed thread
# answered as if it had none, so a resumed session gets its notes on its first
# prompt instead. Checked 2026-11-03 against codex-acp 2.2.2's source
# (createSessionConfig) and real fresh and resumed turns with Codex 0.166.0.
context_env = { CODEX_CONFIG = '{"developer_instructions":{context_json}}' }
# A seat that only talks (plan 0001 B4.2c): the connector's read-only mode. Its
# default mode writes in the working folder without asking, so refusing what it
# asks is not enough: a real talk-only seat created a file. Checked 2026-11-03
# against codex-acp 2.2.2's source (getInitialAgentMode) and a real turn.
# Read-only still reads anything on disk through its shell, which would let one
# blind seat read another's folder, so its tools are off too: a real talking seat
# read a file by its full path until they were. Checked 2026-11-04 against
# `codex features list` (0.166.0) and a real turn.
talk_only_env = { INITIAL_AGENT_MODE = "read-only", CODEX_CONFIG = '{"features":{"shell_tool":false,"unified_exec":false,"apps":false,"plugins":false,"multi_agent":false,"view_image":false,"image_generation":false,"browser_use":false,"browser_use_external":false,"in_app_browser":false,"computer_use":false},"web_search":"disabled"}' }
# A seat that looks and changes nothing (plan 0001 B4.5): the same mode. It reads
# without asking and asks before it changes anything, and a room refuses what it asks.
# Its shell stays, since that is how Codex reads; the tools that act outside the
# sandbox go. A role without `web` can still search, since this mode has one switch.
read_only_env = { INITIAL_AGENT_MODE = "read-only", CODEX_CONFIG = '{"features":{"apps":false,"plugins":false,"multi_agent":false,"image_generation":false,"browser_use":false,"browser_use_external":false,"in_app_browser":false,"computer_use":false}}' }
# A limited seat without the MCP servers you gave Codex: a real talking seat with no
# shell read a file through one, without asking. They go in the config, not the
# session, because the connector's session servers replace the config's whole table.
# Checked 2026-11-04 against `codex mcp list --json` (0.166.0), codex-acp 2.2.2's
# source (createSessionConfig) and real seats. Codex asks before each call to a tool
# server, and a room refuses what a limited seat asks, so the memory DevPulse offers is
# approved here: only that server, scoped to the seat's project.
own_tool_servers = { list = ["mcp", "list", "--json"], config_env = "CODEX_CONFIG", offered = { default_tools_approval_mode = "approve" } }

[history]
# Your sessions, read only, for AgentHub (plan 0009 R3a): one "rollout"
# JSON-lines file per session under sessions/YYYY/MM/DD/ in Codex's home,
# which CODEX_HOME moves.
format = "codex"
root = "~/.codex/sessions"
home_env = "CODEX_HOME"
subdir = "sessions"
# Codex writes its instructions, tools and environment before your first
# request: up to 201 KB of them in the files surveyed 2026-10-25.
prefix_bytes = 524288
