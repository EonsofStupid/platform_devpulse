# Grok Build — xAI's coding agent for SuperGrok and X Premium Plus
# subscribers. Facts checked 2026-10-20 against docs.x.ai/build and the
# official install scripts. Not installed on the machine this was written on:
# the Windows path is unconfirmed against a real install.

# What it is (name, docs, how DevPulse talks to it) is its registry row in
# kernel/devpulse-clyffy/src/providers/registry.rs; this file is where this
# machine keeps it.
id = "grok-build"

[detect]
executables = ["grok"]
paths = { windows = ["~/.grok/bin/grok.exe"], macos = ["~/.grok/bin/grok"], linux = ["~/.grok/bin/grok"] }

[version]
args = ["version"]

[latest]
# The plain-text version the official installer reads.
text_url = "https://x.ai/cli/stable"

[signed_in]
# No status command; `grok login` writes this file. XAI_API_KEY also works,
# so a missing file means "can't tell".
files = { windows = ["~/.grok/auth.json"], macos = ["~/.grok/auth.json"], linux = ["~/.grok/auth.json"] }

[sign_in]
args = ["login"]

[update]
args = ["update"]

[install]
# Install on click (plan 0001 B3.10): xAI's npm package, into the DevPulse
# folder (it needs Node.js). It is published by xAI (maintainer
# xai-security) and listed in the ACP registry; xAI's own docs name only
# their install script so far. Checked 2026-10-24.
npm = "@xai-official/grok"
bin = "grok"

[connect]
# xAI's docs: `grok agent stdio` serves ACP on stdio. Unconfirmed against a
# real install.
args = ["agent", "stdio"]
