[toolchain]
# Latest stable baseline, checked 2026-11-01 (plan 0001 Part L).
# Install only the compiler and the explicitly required development tools.
channel = "1.99.1"
profile = "minimal"
# llvm-tools-preview provides rust-lld.exe — wired as the Windows-MSVC linker
# in .cargo/config.toml. Without it, cargo will fail to find the linker on a
# fresh checkout. Cheap component (~80 MB), keeps the fast-link path
# reproducible across developer boxes.
components = ["rustfmt", "clippy", "rust-analyzer", "llvm-tools-preview"]
