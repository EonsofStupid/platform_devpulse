[package]
name = "devpulse-desktop"
version = "0.1.0"
edition = "2021"
description = "DevPulse Desktop Application"
authors = ["DevPulse Team - Jesse Hall "Hades""]

[lib]
name = "devpulse_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"

# Engine (the hub - coordinates all crates)
engine = { path = "../../engine" }

# Orchestrator (for direct database access)
orchestrator = { path = "../../orchestrator" }

# Shared types (SSOT)
shared = { path = "../../shared" }

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# UUIDs for project IDs
uuid = { version = "1", features = ["v4"] }

# Time
chrono = "0.4"

# WAV audio encoding/decoding
hound = "3"

# Window effects (Mica/vibrancy)
window-vibrancy = "0.7"

# System info (CPU, RAM, GPU metrics)
sysinfo = "0.32"

# NVML for GPU metrics (optional, NVIDIA only)
nvml-wrapper = { version = "0.10", optional = true }

# Screenshot capture (cross-platform)
screenshots = "0.8"

# Image processing (must match screenshots crate's image version)
image = "0.24"

# Base64 encoding for image data
base64 = "0.22"

# Clipboard support
arboard = "3"

[target.'cfg(windows)'.dependencies]
# Windows-specific GPU info (via D3D/DXGI)
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
