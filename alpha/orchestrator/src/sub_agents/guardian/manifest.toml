# GUARDIAN Sub-Agent Manifest

[agent]
id = "guardian"
name = "GUARDIAN"
description = "Monitors codebase state, indexes files, enforces policies"
version = "0.1.0"

[capabilities]
handles_reflex = true
handles_rumination = true
handles_archive = true
has_model = false
background_capable = true

[signals]
# Signals this agent handles
handles = [
    "FileSaved",
    "GitChange",
    "CodeChunk",
    "LargeFileChange",
]

[tools]
# Tools this agent can use
allowed = [
    "file_read",
    "search",
]

[collections]
# RRO collections this agent accesses
reads = ["code"]
writes = ["code"]
