[package]
name = "engine"
version.workspace = true
edition.workspace = true

[features]
default = []
# Dev-tools: exposes orchestrator internals for Lab/debugging
# STRIPPED from release builds via --no-default-features
dev-tools = []

[dependencies]
# Sibling crates
shared = { path = "../shared" }
orchestrator = { path = "../orchestrator", features = ["db"] }
sherpa-rs = { workspace = true }


# From workspace
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

# Async trait support
async-trait = "0.1"
