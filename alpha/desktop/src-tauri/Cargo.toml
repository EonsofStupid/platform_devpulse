[package]
name = "devpulse-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "devpulse_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Dev-tools enabled by default for development builds
# Disable for release: cargo tauri build --release --no-default-features
default = ["dev-tools"]
dev-tools = ["engine/dev-tools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

# ONLY engine - NEVER orchestrator
engine = { path = "../../engine" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
