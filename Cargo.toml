[workspace]
resolver = "2"
members = [
    "kernel/core",
    # "systems/*",    # Uncomment when engines are added
    # "interfaces/*", # Uncomment when apps are added
]

[workspace.dependencies]
# Async
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v7", "v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bitflags = "2.6"
toml = "0.8"
directories = "5.0"

# Profilers
tracy_full = { version = "1.12", features = ["enable", "tracing", "futures"] }
tracing-tracy = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"

# Cache & KV
moka = { version = "0.12", features = ["future"] }
fjall = "2.5"
rkyv = "0.7"

# SQL & OLAP
libsql = "0.6"
duckdb = { version = "1.1", features = ["bundled"] }

# Network
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# AI (Local)
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = "0.20"

# Voice
sherpa-rs = { version = "0.2", features = ["tts"] }

# Media
image = "0.25"

# Screen Capture (Approved: Scap Only)
scap = "0.1"
