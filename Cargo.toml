[workspace]
resolver = "2"
members = [
    "kernel/devpulse-maestro",
    "systems/devpulse-engine",
    "systems/*", 
    "interfaces/desktop/src-tauri",
    "xtask" # The Build Orchestrator
    # EXCLUDED: devpulse_lab (Strictly External)
]

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v7", "serde"] } # 2026 Stable
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"

# Type Sync (D2)
ts-rs = { version = "10.0", features = ["uuid-impl"] } # or specta

# Platform Data (The "Muscle")
libsql = "0.9"
duckdb = "1.1"
surrealdb = { version = "2.6", default-features = false, features = ["kv-mem", "kv-surrealkv"] }
moka = "0.12"
fjall = "2.0"
wal = { git = "https://github.com/EonsofStupid/wal" }
rro = { git = "https://github.com/EonsofStupid/rro" }
tar-rs = { git = "https://github.com/EonsofStupid/tar-rs" }

# Error Handling
anyhow = "1.0"
thiserror = "2.0"

# AI & Voice (The "Senses")
candle-core = "0.8"
candle-transformers = "0.8" 
outlines-core = "0.1"
kokoros = { git = "https://github.com/EonsofStupid/Kokoros" }
ort = "2.0" 

# Ops (xtask Support)
xshell = "0.2" # Shell scripting in Rust
clap = { version = "4.5", features = ["derive"] } # CLI parsing
cargo_metadata = "0.18" # Project introspection
fs_extra = "1.3" # File manipulation

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

# Dev: fast incremental for your code, optimized deps (candle/ort/surreal run fast)
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

# Release: full optimization for Tauri distribution
[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
