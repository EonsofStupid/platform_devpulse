[workspace]
resolver = "2"
members = [
    "kernel/devpulse-clyffy",
    "kernel/model-loader",
    "systems/devpulse-engine",
    "systems/*",
    "interfaces/desktop/src-tauri",
    "xtask" # The Build Orchestrator
    # EXCLUDED: devpulse_lab (Strictly External)
]

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v7", "serde"] } # 2026 Stable
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"

# Type Sync (D2) — specta generates typed TS invoke wrappers; replaces ts-rs
specta = { version = "=2.0.0-rc.22", features = ["derive", "function", "uuid"] }
specta-typescript = "0.0.9"

# Platform Data (The "Muscle")
libsql = "0.9"
duckdb = { version = "1.10500", features = ["bundled"] }
surrealdb = { version = "3.0", default-features = false, features = ["kv-mem", "kv-surrealkv"] }
moka = { version = "0.12", features = ["future"] }
# fjall deferred — SurrealKV covers persistent KV; re-add if perf demands it
wal = { git = "https://github.com/EonsofStupid/wal", branch = "rro-alpha" }
rro = { git = "https://github.com/EonsofStupid/rro", branch = "alpha" }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

# Error Handling
anyhow = "1.0"
thiserror = "2.0"

# AI & Voice (The "Senses")
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic"] }

# Ops (xtask Support)
xshell = "0.2" # Shell scripting in Rust
clap = { version = "4.5", features = ["derive"] } # CLI parsing
cargo_metadata = "0.18" # Project introspection
which = "7.0" # Cross-platform tool resolution (PATHEXT, symlinks)
fs_extra = "1.3" # File manipulation

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

# Patch surrealkv — commit 2e58059 is PR #365 (Windows fsync fix), still version 0.20.2.
# Remove once surrealdb ships with surrealkv >= 0.20.3 that includes this fix.
[patch.crates-io]
surrealkv = { git = "https://github.com/surrealdb/surrealkv", rev = "2e58059734567573cf55379325d718ce1889e004" }
# RRO's fork of tar with set_sync method for snapshot serialization
tar = { git = "https://github.com/EonsofStupid/tar-rs", branch = "rro-alpha" }


# Dev: fast incremental for your code, optimized deps (candle/ort/surreal run fast)
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

# Release: full optimization for Tauri distribution
[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
