[workspace]
resolver = "2"
members = [
    # The AI layer (connectome kernel, model loading/inference, RRD daemon)
    # is Clyffy's — it lives at github.com/EonsofStupid/clyffyos
    # (clyffyos-connectome / clyffyos-model-loader / clyffyos-rrd). DevPulse
    # reaches it over the devpulse-gb10-client wire; model MANAGEMENT is the
    # engine's own platform/model_loader module.
    "systems/devpulse-engine",
    "systems/devpulse-media",
    # persona-mcp is Clyffy's — lives at github.com/EonsofStupid/clyffyos
    # (systems/clyffyos-persona-mcp, evolved). Removed 2026-07-08 with the
    # kernel cut; .mcp.json repoints at the clyffyos-built binary.
    "systems/devpulse-gb10-client",
    "systems/devpulse-store",
    # systems/infra/devpulse-telemetry{,-macros} extracted to
    # github.com/EonsofStupid/devpulse-telemetry (2026-06-28). Sources still on
    # disk under systems/infra/ until the Phase 5 cut; workspace no longer
    # claims them as members so cargo resolves the workspace.dependencies
    # `devpulse-telemetry = { git = ... }` against the published repo.
    "interfaces/desktop/src-tauri",
    "xtask", # The Build Orchestrator
    # EXCLUDED: devpulse_lab (Strictly External)
]
# Vendored sub-workspaces — isolated so their own [workspace.package.*]
# inheritance resolves against THEIR root, not ours. No crate here consumes
# them post-cut (their patches are gone); the trees remain on disk pending
# byte-verification against clyffyos's own deps/ vendors, then deletion.
exclude = [
    "deps/moshi",
    "deps/llama-cpp-rs",
]

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v7", "serde"] } # 2026 Stable
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"

# Type Sync (D2) — specta generates typed TS invoke wrappers; replaces ts-rs
specta = { version = "=2.0.0-rc.22", features = ["derive", "function", "uuid"] }
specta-typescript = "0.0.9"

# Platform Data (The "Muscle")
# turso (Limbo) replaces libsql (operator decision 2026-07-01) — pure-Rust, native
# vector search, turso::sync for the DevPulse↔Clyffy bridge. libsql fully removed.
turso = "0.4.3"
duckdb = { version = "1.10502", features = ["bundled"] }
surrealdb = { version = "3.0", default-features = false, features = ["kv-surrealkv"] }
moka = { version = "0.12", features = ["future"] }
# fjall deferred — SurrealKV covers persistent KV; re-add if perf demands it.
# wal/rro (embedded qortex vector store) and llguidance (constrained decoding)
# are Clyffy-side (clyffyos repo) — no crate here consumes them, so the git
# deps (and their private-fetch CI auth) are gone with the kernel cut.

# Observability — OTel 0.31 pin set (SPRINT-TELEMETRY-FOUNDATION, ADR-002)
# Pinned 2026-04-15 after Q1/Q2 2026 research. Do not bump independently.
# opentelemetry 0.28+ removed `global::shutdown_tracer_provider()` — use
# devpulse_telemetry::TelemetryGuard::shutdown().await.
# opentelemetry-otlp 0.31 ships gRPC-tonic ONLY; HTTP/reqwest exporter dead.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
opentelemetry-otlp = "0.31"
tracing-opentelemetry = "0.32"
opentelemetry-semantic-conventions = "0.31"

# Sync→async channel bridge (MPMC) — wrapped by devpulse-telemetry::channel::flume
flume = "0.11"

# Lock-free shared state (Phase P0: Boot Never Freezes)
# ArcSwap<T> / ArcSwapOption<T> — atomic load/store of Arc<T>, zero lock contention.
# Used for platform state "init once, read many" patterns that must not hold
# a tokio::sync::RwLock across await points.
arc-swap = "1.7"

# Infra — telemetry primitives (Envelope<T>, spawn, channels, OTel SDK).
# Extracted to its own repo 2026-06-28. Branch-tracked while pre-release; pin a
# rev when the API stabilises. CI auth: secrets.DEVPULSE_TELEMETRY_TOKEN (set
# via Infisical, see .github/workflows/ci.yml).
devpulse-telemetry = { git = "https://github.com/EonsofStupid/devpulse-telemetry", branch = "main" }

# Error Handling
anyhow = "1.0"
thiserror = "2.0"

# AI & Voice inference (candle/moshi/qwen3-tts/ort/burn) and AST analysis
# (tree-sitter GUARDIAN) are Clyffy-side (clyffyos repo) — no crate in this
# workspace consumes them. Their workspace entries, crates-io patches, and
# vendored-fork wiring left with the kernel cut.

# Ops (xtask Support)
xshell = "0.2" # Shell scripting in Rust
clap = { version = "4.5", features = ["derive"] } # CLI parsing
cargo_metadata = "0.18" # Project introspection
which = "7.0" # Cross-platform tool resolution (PATHEXT, symlinks)
fs_extra = "1.3" # File manipulation

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# This codebase does extensive intentional-truncation domain math —
# `Duration::as_micros() as u64` for timing, `usize` tensor dimensions
# into `i64` ONNX specs, `u128` GGUF header offsets into smaller ints.
# The ones that are NOT intended are caught by `cast_precision_loss`,
# `cast_sign_loss`, `cast_possible_wrap`, and `cast_lossless`, which
# remain at `warn` (via `pedantic`). `cast_possible_truncation` is
# allowed here and opt-back-in at a per-file or per-site level where
# correctness actually depends on the check.
cast_possible_truncation = "allow"
# Raw tokio::spawn / tokio::task::spawn_blocking are banned (see `clippy.toml`).
# Only `systems/infra/devpulse-telemetry` and its macro companion may `#![allow]`
# these. Escalated to `deny` in S0 after 17 call sites were migrated to
# `devpulse_telemetry::spawn[_blocking]`.
disallowed_methods = "deny"
# `disallowed_types` stays at the workspace-inherited `warn` for now.
# Migration of flume + broadcast channels to `devpulse_telemetry::TracedSender`
# / `BroadcastSender` is scheduled alongside the signal-bus unification in
# the next sprint phase. Escalate to `deny` after migration completes.

# These three stay allowed pending a dedicated lint-tightening slice —
# their original justification (the removed kernel wizard tree + rro
# transitive crates) is gone, but flipping them to warn now would surface
# a workspace-wide diagnostic sweep that deserves its own verified pass.
semicolon_if_nothing_returned = "allow"
doc_markdown = "allow"
doc_lazy_continuation = "allow"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

# [patch.crates-io] removed with the kernel cut — every entry (rro's tar
# fork, the ort fork, the vendored moshi + llama-cpp-rs path patches)
# patched crates that only the AI layer consumed. Inference tooling lives
# with Clyffy (clyffyos repo, which vendors its own deps/ forks).


# Dev: fast incremental for your code, optimized deps (candle/ort/surreal run fast).
#
# `debug = "line-tables-only"` — keeps backtraces useful (file:line works
# in panic dumps and tracing) but skips full DWARF type debug info. Cuts
# compile time meaningfully on a 30+ crate workspace. Bump to `"full"`
# only when stepping through with a debugger.
#
# `incremental = true` is the cargo default but explicit removes ambiguity.
#
# `split-debuginfo` defaults are platform-correct (`packed` on Windows MSVC
# via .pdb side-files, `unpacked` on Linux). Not overriding here.
[profile.dev]
opt-level = 0
incremental = true
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# Release: full optimization for Tauri distribution
[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
