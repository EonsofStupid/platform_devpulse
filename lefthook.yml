# Keep commits quick; run broader checks for the work that actually changed.
glob_matcher: doublestar

pre-commit:
  commands:
    whitespace:
      # Historical source is restored byte-for-byte, including its whitespace.
      run: node scripts/hooks/check-staged-whitespace.cjs
    rust-format:
      glob: ["*.rs", "**/*.rs"]
      exclude: ["recovered/**"]
      run: cargo fmt --all -- --check

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}
