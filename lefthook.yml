# lefthook.yml
# Git hooks for DevPulse - runs before commits/pushes

glob_matcher: doublestar

pre-commit:
  parallel: true
  commands:
    # Rust formatting
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check

    # NOTE: full-workspace compile verification (`cargo check --workspace`)
    # was removed from pre-commit. On a workspace with llama-cpp-sys/DuckDB/
    # Tauri/Candle it cost minutes on EVERY commit, stalling tight edit loops
    # (human and agent) and duplicating the compile that pre-push `clippy
    # --workspace -D warnings` already performs. Compile errors are still
    # caught before they leave the machine (pre-push) and per-crate during a
    # session (.claude/hooks/verify-on-stop.js). Keep pre-commit fast.

    # Svelte check
    svelte-check:
      glob: "*.svelte"
      root: "interfaces/desktop"
      run: pnpm exec svelte-check --threshold error

    # IP boundary enforcement — blocks kernel terms in staged files
    ip-boundary-check:
      glob: "*.{rs,ts,svelte,json}"
      run: bash scripts/hooks/ip-boundary-check.sh

    # Bindings drift guard — if Tauri command .rs files changed but
    # bindings.ts was not regenerated, block commit with an actionable
    # fix. Prevents "installer boots to black screen" class.
    bindings-drift:
      glob: "interfaces/desktop/src-tauri/src/commands/**/*.rs"
      run: bash scripts/hooks/check-bindings-drift.sh

    # Block legacy vendor prefixes (--dp-, --tw-, etc.) — --cl-* is ColdLight's own namespace
    no-legacy-prefixes:
      glob: "interfaces/desktop/src/**/*.{ts,svelte,css}"
      run: bash scripts/hooks/no-legacy-prefixes.sh

    # Biome lint + format check (TypeScript, Svelte, CSS)
    biome-lint:
      glob: "interfaces/desktop/src/**/*.{ts,svelte,css}"
      root: "interfaces/desktop"
      run: pnpm exec biome check .

    # Block raw hex colors and raw px values in Svelte <style> blocks
    # GritQL plugins handle .css files via biome check above
    no-raw-values:
      glob: "interfaces/desktop/src/**/*.{svelte,css,ts}"
      run: node scripts/hooks/no-raw-values.mjs

    # Documentation preflight checks
    docs-preflight:
      glob: "interfaces/desktop/src/**/*.{ts,svelte}"
      run: cd scripts/docs && pnpm preflight:check

    # Token regeneration (SSOT → generated files)
    tokens-regen:
      glob: "interfaces/desktop/src/lib/design/tokens/tokens.ts"
      root: "interfaces/desktop"
      run: pnpm ds:tokens:build
      stage_fixed: true

    # ColdLight manifest verification
    coldlight-verify:
      glob: "interfaces/desktop/src/lib/design/**/*.{ts,svelte}"
      root: "interfaces/desktop"
      run: pnpm coldlight:verify

    # ColdLight auto-documentation generation (TypeDoc → .cowlevel/)
    coldlight-docs:
      glob: "interfaces/desktop/src/lib/design/**/*.{ts,svelte}"
      root: "interfaces/desktop"
      run: pnpm coldlight:docs
      stage_fixed: true

commit-msg:
  commands:
    # Conventional commit format validation
    commitlint:
      run: npx --no -- commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    # Full Rust lint on push
    clippy:
      glob: "*.rs"
      run: cargo clippy --workspace -- -D warnings

    # Format check on push — catches fmt drift that slipped through
    # pre-commit's per-file glob (e.g. fmt issues introduced by a merge
    # commit where incoming branch files weren't staged locally).
    # 2026-06-22: persona MCP fmt drift slipped to GH CI via the Branch 1
    # merge commit; pre-commit fmt only ran on locally-staged files, not
    # merge-introduced ones. Pre-push fmt closes that gap.
    cargo-fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check

    # Security audit
    cargo-deny:
      run: cargo deny check advisories

    # Svelte type check
    svelte-typecheck:
      root: "interfaces/desktop"
      run: pnpm exec svelte-check --threshold error
