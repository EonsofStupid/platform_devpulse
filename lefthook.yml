# lefthook.yml
# Git hooks for DevPulse - runs before commits/pushes

pre-commit:
  parallel: true
  commands:
    # Rust formatting
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check

    # Rust linting (quick check, not full clippy)
    rust-check:
      glob: "*.rs"
      run: cargo check --workspace --quiet

    # Svelte check
    svelte-check:
      glob: "*.svelte"
      root: "interfaces/desktop"
      run: pnpm exec svelte-check --threshold error

    # Biome lint + format check (TypeScript, Svelte, CSS)
    biome-lint:
      glob: "interfaces/desktop/src/**/*.{ts,svelte,css}"
      root: "interfaces/desktop"
      run: pnpm exec biome check .

    # Documentation preflight checks
    docs-preflight:
      glob: "interfaces/desktop/src/**/*.{ts,svelte}"
      run: cd scripts/docs && pnpm preflight:check

    # ColdLight manifest verification
    coldlight-verify:
      glob: "interfaces/desktop/src/lib/design/**/*.{ts,svelte}"
      root: "interfaces/desktop"
      run: pnpm coldlight:verify

    # ColdLight auto-documentation generation (TypeDoc → .cowlevel/)
    coldlight-docs:
      glob: "interfaces/desktop/src/lib/design/**/*.{ts,svelte}"
      root: "interfaces/desktop"
      run: pnpm coldlight:docs
      stage_fixed: true

commit-msg:
  commands:
    # Conventional commit format validation
    commitlint:
      run: npx --no -- commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    # Full Rust lint on push
    clippy:
      glob: "*.rs"
      run: cargo clippy --workspace -- -D warnings

    # Security audit
    cargo-deny:
      run: cargo deny check advisories

    # Svelte type check
    svelte-typecheck:
      root: "interfaces/desktop"
      run: pnpm exec svelte-check --threshold error
