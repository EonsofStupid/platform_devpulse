# lefthook.yml
# Git hooks for DevPulse - runs before commits/pushes

glob_matcher: doublestar

pre-commit:
  parallel: true
  commands:
    # Rust formatting
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check

    # Rust linting (quick check, not full clippy)
    rust-check:
      glob: "*.rs"
      run: cargo check --workspace --quiet

    # Svelte check
    svelte-check:
      glob: "*.svelte"
      root: "interfaces/desktop"
      run: pnpm exec svelte-check --threshold error

    # IP boundary enforcement — blocks kernel terms in staged files
    ip-boundary-check:
      glob: "*.{rs,ts,svelte,json}"
      run: bash scripts/hooks/ip-boundary-check.sh

    # Block --dp- and --cl- prefixes from ever entering the codebase
    no-legacy-prefixes:
      glob: "interfaces/desktop/src/**/*.{ts,svelte,css}"
      run: bash scripts/hooks/no-legacy-prefixes.sh

    # Biome lint + format check (TypeScript, Svelte, CSS)
    biome-lint:
      glob: "interfaces/desktop/src/**/*.{ts,svelte,css}"
      root: "interfaces/desktop"
      run: pnpm exec biome check .

    # Block raw hex colors and raw px values — all values must use design tokens
    no-raw-values:
      glob: "interfaces/desktop/src/**/*.{svelte,css,ts}"
      run: bash scripts/hooks/no-raw-values.sh

    # CSS value enforcement via Stylelint — blocks raw colors, raw px, enforces var(--*)
    stylelint:
      glob: "interfaces/desktop/src/**/*.{svelte,css}"
      root: "interfaces/desktop"
      run: pnpm exec stylelint 'src/**/*.{css,svelte}'

    # Documentation preflight checks
    docs-preflight:
      glob: "interfaces/desktop/src/**/*.{ts,svelte}"
      run: cd scripts/docs && pnpm preflight:check

    # Token regeneration (SSOT → generated files)
    tokens-regen:
      glob: "interfaces/desktop/src/lib/design/tokens/tokens.ts"
      root: "interfaces/desktop"
      run: pnpm ds:tokens:build
      stage_fixed: true

    # ColdLight manifest verification
    coldlight-verify:
      glob: "interfaces/desktop/src/lib/design/**/*.{ts,svelte}"
      root: "interfaces/desktop"
      run: pnpm coldlight:verify

    # ColdLight auto-documentation generation (TypeDoc → .cowlevel/)
    coldlight-docs:
      glob: "interfaces/desktop/src/lib/design/**/*.{ts,svelte}"
      root: "interfaces/desktop"
      run: pnpm coldlight:docs
      stage_fixed: true

commit-msg:
  commands:
    # Conventional commit format validation
    commitlint:
      run: npx --no -- commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    # Full Rust lint on push
    clippy:
      glob: "*.rs"
      run: cargo clippy --workspace -- -D warnings

    # Security audit
    cargo-deny:
      run: cargo deny check advisories

    # Svelte type check
    svelte-typecheck:
      root: "interfaces/desktop"
      run: pnpm exec svelte-check --threshold error
