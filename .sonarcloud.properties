# SonarCloud Automatic Analysis configuration.
#
# Generated artifacts and DTCG token DATA are not hand-written code:
# rating them (duplication, reliability) measures the emitters, not the
# source. The pipeline sources that PRODUCE these files stay analyzed.
#
# - src/lib/design/{styles,theme,types,generated} + renderforge/generated
#   are Style Dictionary 5 outputs ("Do not edit directly" headers).
# - src/lib/sys/generated is tauri-specta binding output.
# - src-tauri/gen is Tauri schema output.
# - scripts/build/styledictionary/tokens is DTCG token data — inherently
#   repetitive by format (one object per token), excluded from duplication
#   detection but kept out of analysis entirely as data, not code.
# - deps/ is vendored third-party forks; docs/site is a static site bundle.
sonar.exclusions=\
  interfaces/desktop/src/lib/design/styles/**,\
  interfaces/desktop/src/lib/design/theme/**,\
  interfaces/desktop/src/lib/design/types/**,\
  interfaces/desktop/src/lib/design/generated/**,\
  interfaces/desktop/src/lib/design/renderforge/generated/**,\
  interfaces/desktop/src/lib/sys/generated/**,\
  interfaces/desktop/src-tauri/gen/**,\
  interfaces/desktop/scripts/build/styledictionary/tokens/**,\
  deps/**,\
  docs/site/**

sonar.cpd.exclusions=\
  interfaces/desktop/scripts/build/styledictionary/tokens/**,\
  interfaces/desktop/src/lib/design/styles/**,\
  interfaces/desktop/src/lib/design/theme/**
