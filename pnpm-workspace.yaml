packages:
  - "interfaces/desktop"
  - "packages/*"
  - "scripts/docs"

# One version of each dependency the app and ColdLight share, so both
# resolve the same copy (two Svelte runtimes in one page break it).
catalog:
  "@sveltejs/vite-plugin-svelte": ^7.3.1
  "@types/node": ^26.6.6
  "@vitest/browser-playwright": ^5.1.0
  "@vitest/coverage-v8": ^5.1.0
  arktype: ^2.2.9
  clsx: ^2.1.1
  lucide-svelte: ^1.0.1
  playwright: ^1.64.1
  shiki: ^4.6.0
  svelte: ^5.57.3
  svelte-check: ^4.7.8
  tailwindcss: ^4.3.4
  typedoc: ^0.28.20
  typescript: ^6.0.3
  vite: ^8.3.5
  vitest: ^5.1.0
  vitest-browser-svelte: ^3.1.0

# Install scripts run only where listed true. The false entries record that
# these packages have scripts (engine and browser-driver downloads, esbuild's
# binary check) and do not need them here.
allowBuilds:
  "@eonsofstupid/shiki": true
  "@prisma/engines": false
  edgedriver: false
  esbuild: false
  geckodriver: false
  prisma: false
  shiki: true

overrides:
  get-tsconfig: ^4.13.6
  # vitest-preview asks for jsdom 27. A second copy splits Vitest into two
  # instances, and ColdLight's tests then lose the types of `expect.element`.
  jsdom: ^30.1.3

# Newest releases taken by the latest-stable upgrade inside pnpm's one-day hold.
minimumReleaseAgeExclude:
  - "@biomejs/biome@2.6.5"
  - "@biomejs/cli-android-arm64@2.6.5"
  - "@biomejs/cli-android-x64@2.6.5"
  - "@biomejs/cli-darwin-arm64@2.6.5"
  - "@biomejs/cli-darwin-x64@2.6.5"
  - "@biomejs/cli-linux-arm64-musl@2.6.5"
  - "@biomejs/cli-linux-arm64@2.6.5"
  - "@biomejs/cli-linux-x64-musl@2.6.5"
  - "@biomejs/cli-linux-x64@2.6.5"
  - "@biomejs/cli-win32-arm64@2.6.5"
  - "@biomejs/cli-win32-x64@2.6.5"
  - "@supabase/auth-js@2.119.0"
  - "@supabase/functions-js@2.119.0"
  - "@supabase/postgrest-js@2.119.0"
  - "@supabase/realtime-js@2.119.0"
  - "@supabase/storage-js@2.119.0"
  - "@supabase/supabase-js@2.119.0"
  - style-dictionary@5.8.0
  - surrealdb@2.2.2
