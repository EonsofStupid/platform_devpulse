packages:
  - "interfaces/desktop"
  - "packages/*"
  - "scripts/docs"

# One version of each dependency the app and ColdLight share, so both
# resolve the same copy (two Svelte runtimes in one page break it).
catalog:
  "@sveltejs/vite-plugin-svelte": ^6.2.4
  "@types/node": ^25.0.9
  "@vitest/browser-playwright": ^4.0.17
  "@vitest/coverage-v8": ^4.0.17
  arktype: ^2.2.0
  clsx: ^2.1.1
  lucide-svelte: ^0.564.0
  playwright: ^1.58.2
  shiki: ^4.0.2
  svelte: ^5.0.0
  svelte-check: ^4.3.5
  tailwindcss: ^4.1.18
  typescript: ^5.9.3
  vite: ^7.3.2
  vitest: ^4.0.18
  vitest-browser-svelte: ^2.0.2

onlyBuiltDependencies:
  - "@eonsofstupid/shiki"
  - "shiki"
