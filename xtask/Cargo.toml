[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
cargo_metadata = { workspace = true }
which = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
# Fetch pipeline for DevForge release artifacts (commands::fetch_devforge).
# Sync HTTP + SHA256 + zip extraction. Native-tls keeps us off aws-lc-sys
# in xtask — the workspace already has NASM wired for the main build but
# xtask should stay light and use Windows Schannel.
ureq = { version = "3.5.0", default-features = false, features = ["native-tls", "gzip"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = { workspace = true }
hex = { workspace = true }
# ISO8601 timestamps for build.manifest.json. Already workspace-pinned.
chrono = { workspace = true }
# CycloneDX 1.4 requires `serialNumber: "urn:uuid:<uuid>"` — v4 is deterministic
# enough for build identification. Small, widely-trusted crate.
uuid = { version = "1", features = ["v4"] }
# Recursive directory walker for portable build resource staging. Tauri's
# `bundle.resources` map form lets a single entry (e.g. DevForge REH tree,
# 3000+ files) declare a whole subtree; we walk it to enumerate files. Tiny
# crate, zero transitive bloat, already the de-facto Rust standard.
walkdir = "2.5"
# MSVC toolchain discovery via the same registry walk Rust's own bootstrap
# uses. Powers `BuildConfig::activate_msvc_env` which exports INCLUDE / LIB /
# LIBPATH / PATH for cl.exe so the cmake `Ninja` generator can find the
# toolchain without a manual vcvars64.bat invocation. The crate is already a
# transitive dep of dozens of build.rs scripts in the workspace — the explicit
# entry just lets xtask use the public `windows_registry` module directly.
#
# 1.11.0 is the floor: older releases since 1.5.0 pass MSVC C++ sources as a
# separate `-Tp` argument, which sccache before 0.19 turns into C1083. From
# 1.11.0 (rust-lang/cc-rs#2063) it is one `-Tp<path>` argument: sccache 0.19
# caches it and older sccache compiles it uncached.
cc = "1.11.0"
# OS keyring read for the auto-updater signing key. Matches the canonical
# `devpulse:*` keyring entry pattern used by the desktop tier's cloud /
# credential modules. The release-publish task pulls the Ed25519 private
# key from `devpulse:release-signing-key` and passes it to `tauri signer`
# via the `TAURI_SIGNING_PRIVATE_KEY` env var; the operator never has to
# touch the raw key material.
keyring = { workspace = true }

[dev-dependencies]
# Tempdir fixtures for smoke.rs boot-log parsing tests.
tempfile = "3"
# Asks keyring which store it selected, without touching any secret.
keyring-core = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_JobObjects",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[lints]
workspace = true
