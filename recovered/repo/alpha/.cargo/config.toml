# Cargo configuration for DevPulse
#
# Windows builds require VS Developer environment for native dependencies.
# Run builds from "Developer Command Prompt for VS 2022" or use the wrapper script.

[target.x86_64-pc-windows-msvc]
# Use MSVC linker with dynamic CRT (/MD) for all code
linker = "link.exe"
# Explicitly use DYNAMIC CRT (-crt-static) to match CFLAGS=/MD
# This ensures Rust code and C dependencies all link against msvcrt.dll
rustflags = ["-C", "target-feature=-crt-static"]

[build]
# Optimize incremental builds
incremental = true

[env]
# Force ALL C/C++ dependencies to use dynamic CRT (/MD)
# This fixes LNK2038 RuntimeLibrary mismatch between esaxx-rs and libduckdb
CFLAGS = "/MD"
CXXFLAGS = "/MD"
CL = "/MD"

# For esaxx-rs specifically
ESAXX_STATIC_CRT = "0"

# Disable pkg-config for zstd-sys (not available on Windows)
# Forces build from bundled source instead of probing for system library
LIBZSTD_NO_PKG_CONFIG = "1"

[alias]
xtask = "run --package xtask --"
