# ═══════════════════════════════════════════════════════════════
# BUILT-INS — Kernel SSOT
# ═══════════════════════════════════════════════════════════════
#
# Built-ins are platform services that ship with the binary, load at
# boot, and are NOT user-toggleable as slots. They appear in the
# Slot Config overlay's "System" tab as read-only status rows.
#
# Per the locked sprint decisions (D1, D3, D8):
#
# - In `mode-dev` builds, built-ins are fully configurable for
#   development experimentation — the UI lets the user swap the
#   underlying model file via the system tab.
# - In `mode-production` builds, built-ins are visible and their
#   status is readable, but swapping a built-in model goes through
#   the sanctioned upgrade flow rather than a free-form file picker.
# - In `mode-customer` builds, built-ins are fully managed — all
#   upgrades arrive via managed services, the UI hides the picker.
#
# The kernel loader at `built_ins.rs` parses this file via
# `include_str!` and honours `{userdata}/config/built_ins.toml` as a
# user override (full-replace).
#
# ── IP boundary ────────────────────────────────────────────────
#
# Per `systems/devpulse-engine/ip/kernel_terms.toml`, the following
# kernel terms have mandatory public aliases:
#
#   RRO        → "prepared context"
#   reranking  → "result refinement"
#   CAG        → "cached retrieval"
#
# This file uses the kernel terms inside the `id` fields because it
# lives inside `kernel/`. The `public_label` field on every entry is
# what the frontend shows users — that label is what the Slot Config
# overlay renders.
#
# ── Extension pattern ──────────────────────────────────────────
#
# To add a new built-in:
#
#   1. Append a new `[[built_ins]]` entry with every required field.
#   2. If the built-in needs a runtime handle, add a loader method to
#      `built_ins.rs` that routes through the same pattern (include_str!
#      + override).
#   3. The Slot Config System tab automatically renders the new row.
#
# ═══════════════════════════════════════════════════════════════

# ── 1. Vector memory (kernel: RRO; public: "prepared context") ─

[[built_ins]]
id = "rro"
kernel_name = "RRO Vector Store"
public_label = "Prepared Context"
description = "Embedded vector memory for cross-session recall and semantic search"
category = "memory"
persistence_class = "always_on"
lane = "cpu"
upgradeable = false
bundled = true
# Implementation lives in `kernel/devpulse-clyffy/src/cortex/persistence/rro.rs`.
# No model file — RRO is a storage engine, not a model.

# ── 2. Primary text encoder — Qwen3-Embedding-0.6B ─────────────
#
# Upgradeable (P6). The user can swap the model file through the
# Slot Config System tab when build mode allows, but the built-in
# "encoder" slot itself cannot be disabled — the filter and search
# system depend on having an embedding backend at all times.

[[built_ins]]
id = "encoder.primary"
kernel_name = "Qwen3-Embedding-0.6B"
public_label = "Search Engine"
description = "Primary text-to-vector encoder used by memory and search"
category = "encoder"
persistence_class = "always_on"
lane = "cpu"
upgradeable = true
bundled = false
# Default model — user can upgrade via the System tab to e.g.
# Qwen3-Embedding-4B or a custom fine-tune.
default_model_repo = "Qwen/Qwen3-Embedding-0.6B"
default_model_filename = "model.safetensors"

# ── 3. Result filter (kernel: reranker; public: "filter") ──────
#
# Per D3, the previous `rag.reranker` slot becomes a built-in here.
# Users never toggle it, never see "reranking" in the UI — the
# public label is simply "Filter" and it runs whenever the search
# pipeline produces more candidates than needed.

[[built_ins]]
id = "filter.primary"
kernel_name = "Qwen3-Reranker-0.6B"
public_label = "Filter"
description = "Refines search results so the most relevant matches appear first"
category = "filter"
persistence_class = "on_demand"
lane = "cpu"
upgradeable = true
bundled = false
default_model_repo = "Qwen/Qwen3-Reranker-0.6B"
default_model_filename = "model.safetensors"

# ── 4. Wake-word detector (always-on) ─────────────────────────
#
# Per D9, the platform ships a built-in always-on wake word detector.
# The `voice.wake` slot (see slots.default.toml) is a USER OVERRIDE
# path — when the user assigns a model to that slot, it takes
# precedence over this built-in. Absent such an override, this
# built-in handles all wake events.

[[built_ins]]
id = "wake.builtin"
kernel_name = "BuiltinWakeWord"
public_label = "Wake Word"
description = "Always-listening wake word detector — triggers voice mode"
category = "wake_word"
persistence_class = "always_on"
lane = "cpu"
upgradeable = false
bundled = true
# Default wake-word model will land in a subsequent cut — scaffolded
# here so the system tab has a row ready to display.
default_model_repo = ""
default_model_filename = ""
